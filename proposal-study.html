<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Freeman — Proposal Study</title>
<style>
:root{--paper:#eeebe4;--ink:#24211d;--muted:#847e75;--line:#ccc5ba;--accent:#e75b2c}*{box-sizing:border-box}html,body{height:100%;margin:0;overflow:hidden}body{font:12px/1.6 Monaco,"Courier New",monospace;color:var(--ink);background:var(--paper)}button,a{font:inherit;color:inherit}button{background:none;border:0;cursor:pointer;text-align:left}button:hover,a:hover{color:var(--accent)}button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:3px}.frame{height:100dvh;padding:22px 28px 18px;display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:16px}.head,.foot{display:flex;justify-content:space-between;align-items:center;gap:16px}.head{border-bottom:1px solid var(--line);padding-bottom:14px}.brand{text-decoration:none;font-weight:700;font-size:14px;letter-spacing:-.05em}.micro,.foot{font-size:10px;color:var(--muted);letter-spacing:.06em}.foot{border-top:1px solid var(--line);padding-top:13px}.main{display:grid;grid-template-columns:38% 62%;min-height:0;border-bottom:1px solid var(--line)}.identity{border-right:1px solid var(--line);padding:16px 24px 24px 0;display:flex;flex-direction:column;justify-content:space-between}.identity h1{font-size:clamp(42px,7vw,104px);font-weight:400;letter-spacing:-.095em;line-height:.95;overflow-wrap:anywhere;margin:24px 0}.identity p{font-size:clamp(11px,1.2vw,15px);max-width:33ch}.panel{padding:16px 0 24px 26px;display:grid;grid-template-rows:auto minmax(0,1fr) auto;min-height:0}.panelmeta{display:flex;justify-content:space-between;color:var(--muted);font-size:10px;letter-spacing:.08em}.body{align-self:center;max-height:100%;overflow:auto;scrollbar-width:thin;width:100%}.body h2{font-size:clamp(26px,4vw,52px);font-weight:400;letter-spacing:-.075em;line-height:1.15;margin:12px 0 20px}.body p{font-size:13px;max-width:64ch;line-height:1.7}.item{display:grid;grid-template-columns:40px 1fr 20px;gap:14px;width:100%;padding:15px 0;border-top:1px solid var(--line);align-items:center}.item:last-child{border-bottom:1px solid var(--line)}.item span:first-child{color:var(--accent);font-size:10px}.item strong{font-size:clamp(15px,1.6vw,22px);font-weight:400;letter-spacing:-.045em}.row{display:grid;grid-template-columns:36% 1fr;gap:12px;border-top:1px solid var(--line);padding:13px 0}.row:last-child{border-bottom:1px solid var(--line)}.row span{font-size:10px;color:var(--muted)}.row b{font-size:12px;font-weight:400}.controls{display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:20px}.control{font-size:10px;text-transform:uppercase;letter-spacing:.08em;padding:6px 0}.note{font-size:10px;color:var(--muted)}.alert{font-size:11px;border-left:2px solid var(--accent);padding-left:12px;color:var(--muted);max-width:60ch;margin-top:18px}.action{display:inline-block;text-decoration:none;background:var(--ink);color:var(--paper);padding:12px 16px;margin-top:20px;font-size:11px}.action:hover{background:var(--accent);color:white}.hidden{display:none!important}
@media(max-width:720px){.frame{padding:13px 16px 12px;gap:9px}.head{padding-bottom:8px}.brand{font-size:11px}.micro,.foot{font-size:8px}.main{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr)}.identity{border-right:0;border-bottom:1px solid var(--line);padding:6px 0 10px;display:block}.identity h1{font-size:clamp(30px,10vw,52px);margin:8px 0}.identity p{font-size:10px;max-width:none}.identity .secondary{display:none}.panel{padding:8px 0 12px}.panelmeta{font-size:8px}.body h2{font-size:25px;margin:8px 0}.body p{font-size:11px}.item{padding:9px 0;grid-template-columns:28px 1fr 16px}.item strong{font-size:14px}.row{padding:8px 0}.row b{font-size:10px}.foot{padding-top:8px}.note{font-size:8px}}
</style></head>
<body><div class="frame"><header class="head"><a class="brand" href="./">FREEMAN GENERAL CONTRACTING</a><span class="micro">PRIVATE / PROPOSAL STUDY</span></header>
<main class="main"><section class="identity"><div><div class="micro" id="label">ALDER PASS 02 / FICTIONAL STUDY</div><h1 id="hero">Alder.</h1><p id="thesis">A restaurant built around the experience of gathering.</p></div><div class="micro secondary">BUILT FOR GENERATIONS<br>CAR­TERS­VILLE, GEORGIA</div></section>
<section class="panel"><div class="panelmeta"><span id="chapter">PROPOSAL INDEX</span><span id="count">00 / 07</span></div><div class="body" id="body"></div><div class="controls"><button class="control hidden" id="back">← Back</button><span class="note">ILLUSTRATIVE / NOT FOR ACCEPTANCE</span><button class="control hidden" id="next">Next →</button></div></section></main>
<footer class="foot"><span>FREEMAN / STUDY 02</span><a href="onboarding.html">ONBOARDING STUDY ↗</a></footer></div>
<script>
(()=>{
const chapters=[
{title:"Overview",headline:"The project.",summary:"A concise introduction to the project, its intent, and Freeman’s approach.",rows:[["Project","Alder / fictional hospitality study"],["Location","To be confirmed"],["Vision","A distinct place for gathering"],["Agreement","Final project details require a reviewed proposal"]]},
{title:"Scope",headline:"Scope of work.",summary:"Make inclusions, exclusions, and assumptions clear before anyone signs.",rows:[["Construction","Per approved drawings and scope"],["Procurement","Roles and long-lead items to be confirmed"],["Exclusions","To be itemized in the executed proposal"],["Changes","Governed by the final agreement"]]},
{title:"Estimate",headline:"The investment.",summary:"Break down construction costs clearly, without invented numbers.",rows:[["Construction cost","Pending approved estimate"],["General conditions","To be detailed"],["Allowances","To be identified"],["Total","Not provided in this study"]]},
{title:"Schedule",headline:"From start to finish.",summary:"The working sequence, critical milestones, and owner decisions.",rows:[["Preconstruction","Dates to be confirmed"],["Mobilization","Pending prerequisites"],["Construction","Per approved project schedule"],["Completion","Subject to project conditions"]]},
{title:"Project team",headline:"The people.",summary:"Real faces and responsibilities, confirmed before client delivery.",rows:[["Leadership","Freeman representative to be confirmed"],["Project manager","To be assigned"],["Superintendent","To be assigned"],["Client contact","To be confirmed"]]},
{title:"References",headline:"The evidence.",summary:"Relevant built work, project photographs, and references shared with permission.",rows:[["Comparable projects","To be selected"],["Photography","Verified work only"],["Client references","With prior permission"],["Supporting material","Available when appropriate"]]}];
let current=-1;
const $=id=>document.getElementById(id);
function render(){
const home=current<0, last=current===6,c=chapters[current];
$("back").classList.toggle("hidden",home);$("next").classList.toggle("hidden",home||last);
$("count").textContent=home?"00 / 07":String(current+1).padStart(2,"0")+" / 07";
$("chapter").textContent=home?"PROPOSAL INDEX":last?"REVIEW & HANDOFF":c.title.toUpperCase();
$("hero").textContent=home?"Alder.":last?"Next.":c.title+".";
$("thesis").textContent=home?"A restaurant built around the experience of gathering.":last?"A clear path from proposal to project kickoff.":c.summary;
$("next").textContent=current===5?"Review →":"Next →";
if(home){$("body").innerHTML=chapters.map((x,i)=>'<button class="item" data-i="'+i+'"><span>0'+(i+1)+'</span><strong>'+x.title+'</strong><span>↗</span></button>').join("")+'<button class="item" data-i="6"><span>07</span><strong>Review & next steps</strong><span>↗</span></button>';document.querySelectorAll("[data-i]").forEach(x=>x.onclick=()=>{current=Number(x.dataset.i);render()});}
else if(last){$("body").innerHTML='<h2>From proposal to partnership.</h2><p>After formal approval and contract execution, Freeman provides the client with a guided onboarding experience: people, process, Procore, and kickoff.</p><div class="alert">DEMONSTRATION ONLY. This page cannot approve a proposal, sign a contract, or notify the Freeman team. Do not treat this as a binding acceptance.</div><a class="action" href="onboarding.html#client/0">Preview client onboarding ↗</a>';}
else{$("body").innerHTML='<h2>'+c.headline+'</h2><p>'+c.summary+'</p>'+c.rows.map(r=>'<div class="row"><span>'+r[0]+'</span><b>'+r[1]+'</b></div>').join("");}
history.replaceState({},'',location.pathname+(home?'':'#'+current));
}
$("back").onclick=()=>{current=current===0?-1:current-1;render()};$("next").onclick=()=>{if(current<6)current++;render()};
const match=location.hash.match(/^#([0-6])$/);if(match)current=Number(match[1]);render();
})();
</script></body></html>

name: The Record — desktop and phone

on:
  push:
    branches:
      - study/the-record-discovery-003
      - study/map-nav-mobile-001
      - release/approved-v5-2026-10-18
  workflow_dispatch:

permissions:
  contents: read

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install browser and Pages emulator
        run: |
          python -m pip install playwright==1.60.0
          python -m playwright install --with-deps chromium
          npm install --no-save wrangler@4
      - name: Start local Pages
        run: |
          npx wrangler pages dev v5 --port 8788 --ip 127.0.0.1 > wrangler-record.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:8788/record > /dev/null && exit 0; sleep 1; done
          cat wrangler-record.log
          exit 1
      - name: The Record desktop and phone browser QA
        run: python qa/record-discovery-003-qa.py http://127.0.0.1:8788
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: the-record-003-screenshots
          path: qa/results/record-discovery-003/

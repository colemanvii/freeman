name: QA — ACCESS, Alder and public navigation

# Runs the Playwright suites against a local Cloudflare Pages emulation of v5/
# (same _redirects and extensionless-URL behaviour as production).
on:
  pull_request:
    branches: ["freeman-v5-consolidation"]
  push:
    branches: ["freeman-v5-consolidation", "fix/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Playwright and Wrangler
        run: |
          pip install playwright==1.60.0
          python -m playwright install --with-deps chromium
          npm install --no-save wrangler@4
      - name: Start Pages emulation
        run: |
          npx wrangler pages dev v5 --port 8788 --ip 127.0.0.1 --binding FREEMAN_OS_PASSWORD=qa-demo-password --binding FREEMAN_OS_SESSION_KEY=qa-session-key-0123456789abcdef0123456789 > wrangler.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:8788/client-access > /dev/null && exit 0; sleep 1; done
          cat wrangler.log; exit 1
      - name: ACCESS and Alder
        run: python qa/access-alder-qa.py http://127.0.0.1:8788 qa/results/access-alder.json
      - name: Public navigation
        if: always()
        run: python qa/public-navigation-qa.py http://127.0.0.1:8788 qa/results/public-navigation.json
      - name: FreemanGC V4 desktop and mobile
        if: always()
        run: python qa/freemangc-v4-qa.py http://127.0.0.1:8788
      - name: FreemanGC V4 homepage (script, colorways, lifecycle)
        if: always()
        run: python qa/freemangc-v4-home-qa.py http://127.0.0.1:8788
      - name: FreemanOS password gate
        if: always()
        run: python qa/team-os-gate-qa.py http://localhost:8788 qa/results/team-os-gate.json qa-demo-password
      - name: Palette continuity through Team Access
        if: always()
        run: python qa/palette-continuity-qa.py http://localhost:8788 qa-demo-password
      - name: FreemanOS Study 07 workspaces
        if: always()
        run: python qa/freeman-os-study07-qa.py http://127.0.0.1:8788 qa-demo-password
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qa-results
          path: qa/results/

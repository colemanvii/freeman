<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Freeman — House Mark Study</title>
<meta name="theme-color" content="#f2efe8">
<style>
:root{
  --paper:#f2efe8;
  --ink:#151514;
  --muted:#73716b;
  --line:rgba(21,21,20,.18);
  --orange:#e85a2a;
}
*{box-sizing:border-box}
html,body{
  margin:0;
  width:100%;
  min-height:100%;
  background:var(--paper);
  color:var(--ink);
}
body{
  font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit}
.page{
  min-height:100dvh;
  display:grid;
  grid-template-rows:auto 1fr auto;
  padding:24px 28px 22px;
}
.top{
  display:grid;
  grid-template-columns:1fr auto;
  align-items:start;
  border-bottom:1px solid var(--line);
  padding-bottom:14px;
}
.identity{
  display:flex;
  gap:14px;
  align-items:baseline;
}
.name{
  font-size:11px;
  font-weight:700;
  letter-spacing:.08em;
  text-transform:uppercase;
}
.place{
  font-family:Monaco,"Courier New",monospace;
  font-size:8px;
  letter-spacing:.08em;
  text-transform:uppercase;
  color:var(--muted);
}
.est{
  font-family:Monaco,"Courier New",monospace;
  font-size:8px;
  line-height:1.35;
  letter-spacing:.08em;
  text-transform:uppercase;
  text-align:right;
  color:var(--muted);
}
.hero{
  position:relative;
  display:grid;
  place-items:center;
  min-height:0;
}
.center{
  display:grid;
  justify-items:center;
  gap:20px;
  transform:translateY(-1.5vh);
}
.mark{
  width:min(27vw,340px);
  aspect-ratio:1/1;
  display:grid;
  place-items:center;
  position:relative;
}
.mark:before,
.mark:after{
  content:"";
  position:absolute;
  inset:8%;
  border:1px solid var(--ink);
  border-radius:50%;
}
.mark:after{
  inset:21%;
  border-color:var(--line);
}
.monogram{
  width:62%;
  height:62%;
}
.tagline{
  font-family:Georgia,"Times New Roman",serif;
  font-size:clamp(28px,3.2vw,54px);
  line-height:.95;
  letter-spacing:-.045em;
  text-align:center;
  font-weight:400;
}
.sectors{
  font-family:Monaco,"Courier New",monospace;
  font-size:8px;
  letter-spacing:.12em;
  text-transform:uppercase;
  color:var(--muted);
}
.bottom{
  border-top:1px solid var(--line);
  padding-top:14px;
  display:grid;
  grid-template-columns:1fr auto 1fr;
  align-items:end;
}
.nav{
  display:flex;
  gap:18px;
  font-family:Monaco,"Courier New",monospace;
  font-size:9px;
  letter-spacing:.04em;
  text-transform:uppercase;
}
.nav a{
  position:relative;
}
.nav a:after{
  content:"";
  position:absolute;
  left:0;
  right:100%;
  bottom:-3px;
  height:1px;
  background:var(--ink);
  transition:right .18s ease;
}
.nav a:hover:after{right:0}
.note{
  justify-self:center;
  font-family:Georgia,"Times New Roman",serif;
  font-style:italic;
  font-size:12px;
  color:var(--muted);
}
.portal{
  justify-self:end;
  font-family:Monaco,"Courier New",monospace;
  font-size:9px;
  letter-spacing:.05em;
  text-transform:uppercase;
}
.portal span{color:var(--orange)}
.corner{
  position:absolute;
  font-family:Monaco,"Courier New",monospace;
  font-size:7px;
  line-height:1.4;
  letter-spacing:.08em;
  text-transform:uppercase;
  color:var(--muted);
}
.corner.left{left:0;top:50%;transform:translateY(-50%)}
.corner.right{right:0;top:50%;transform:translateY(-50%);text-align:right}
.rule{
  width:26px;
  height:1px;
  background:var(--orange);
  margin:0 auto 2px;
}
@media(max-width:780px){
  .page{padding:16px}
  .identity{display:grid;gap:4px}
  .place{font-size:7px}
  .est{font-size:7px}
  .mark{width:min(58vw,300px)}
  .corner{display:none}
  .tagline{font-size:clamp(34px,9vw,50px)}
  .bottom{
    grid-template-columns:1fr auto;
    gap:12px;
  }
  .nav{gap:11px;font-size:8px;flex-wrap:wrap}
  .note{display:none}
  .portal{font-size:8px}
}
</style>
</head>
<body>
<main class="page">
  <header class="top">
    <div class="identity">
      <div class="name">Freeman General Contracting</div>
      <div class="place">Cartersville, Georgia</div>
    </div>
    <div class="est">Built for Generations™<br>Established in Georgia</div>
  </header>

  <section class="hero">
    <div class="corner left">Hospitality<br>Commercial<br>Residential</div>
    <div class="corner right">Field-led<br>Owner-minded<br>Built to last</div>

    <div class="center">
      <div class="mark" aria-label="Freeman house mark">
        <svg class="monogram" viewBox="0 0 240 240" role="img" aria-label="FGC monogram">
          <path d="M45 178V63h75M45 116h61" fill="none" stroke="currentColor" stroke-width="7" stroke-linecap="square"/>
          <path d="M178 88c-12-19-31-30-54-30-35 0-63 28-63 63s28 63 63 63c28 0 50-15 60-38h-59" fill="none" stroke="currentColor" stroke-width="7" stroke-linecap="square"/>
          <path d="M181 120h-48" fill="none" stroke="var(--orange)" stroke-width="3"/>
        </svg>
      </div>

      <div class="rule"></div>
      <div class="tagline">Built for Generations.</div>
      <div class="sectors">Hospitality / Commercial / Residential</div>
    </div>
  </section>

  <footer class="bottom">
    <nav class="nav" aria-label="Primary">
      <a href="../v3-study.html">Selected Work</a>
      <a href="#">Company</a>
      <a href="../archive/">Field Notes</a>
    </nav>
    <div class="note">A builder’s mark.</div>
    <a class="portal" href="../portal.html"><span>●</span>&nbsp;&nbsp;Client Portal</a>
  </footer>
</main>
</body>
</html>

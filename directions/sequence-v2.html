<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Freeman — Sequence Study II</title>
<meta name="theme-color" content="#0a0a0a">
<style>
:root{
  --paper:#efeee9;
  --black:#0a0a09;
  --white:#f5f3ed;
  --muted:rgba(245,243,237,.58);
  --line:rgba(245,243,237,.2);
  --orange:#f05a28;
}
*{box-sizing:border-box}
html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:var(--black);
}
body{
  font-family:Monaco,"Courier New",monospace;
  -webkit-font-smoothing:antialiased;
}
a{color:inherit;text-decoration:none}
button{font:inherit}

.stage{
  position:fixed;
  inset:0;
  background:var(--black);
  color:var(--white);
  cursor:e-resize;
}
.stage[data-mode="title"],
.stage[data-mode="end"]{
  cursor:default;
}
.image{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  object-position:center;
  opacity:1;
  transform:scale(1.001);
  filter:saturate(.86) contrast(1.04) brightness(.84);
  transition:opacity .18s linear;
}
.scrim{
  position:absolute;
  inset:0;
  background:
    linear-gradient(to bottom,rgba(0,0,0,.12),transparent 28%),
    linear-gradient(to top,rgba(0,0,0,.38),transparent 34%);
  pointer-events:none;
}
.ui{
  position:absolute;
  inset:0;
  padding:18px 20px 16px;
  display:grid;
  grid-template-rows:auto 1fr auto;
  pointer-events:none;
}
.top,
.bottom{
  display:grid;
  grid-template-columns:1fr auto 1fr;
  align-items:start;
}
.brand{
  font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;
  font-size:12px;
  font-weight:700;
  letter-spacing:-.035em;
}
.index{
  justify-self:center;
  font-size:8px;
  letter-spacing:.08em;
  color:var(--muted);
}
.navhint{
  justify-self:end;
  text-align:right;
  font-size:7px;
  line-height:1.45;
  letter-spacing:.08em;
  text-transform:uppercase;
  color:var(--muted);
}
.caption{
  align-self:end;
  font-size:8px;
  line-height:1.45;
  letter-spacing:.07em;
  text-transform:uppercase;
  color:var(--muted);
}
.note{
  justify-self:center;
  align-self:end;
  font-family:Georgia,"Times New Roman",serif;
  font-style:italic;
  font-size:12px;
  color:rgba(245,243,237,.78);
}
.counter{
  justify-self:end;
  align-self:end;
  font-size:8px;
  letter-spacing:.08em;
  color:var(--muted);
}

.copy{
  position:absolute;
  left:7vw;
  bottom:10vh;
  max-width:720px;
  font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;
  font-size:clamp(38px,5.3vw,82px);
  line-height:.93;
  letter-spacing:-.055em;
  font-weight:500;
  text-wrap:balance;
  pointer-events:none;
}
.copy.quiet{
  font-size:clamp(22px,3vw,44px);
  max-width:560px;
  letter-spacing:-.035em;
}
.copy.empty{display:none}

.titlecard,
.endcard{
  position:absolute;
  inset:0;
  background:var(--paper);
  color:#111;
  display:none;
  z-index:3;
}
.titlecard.active,
.endcard.active{display:grid}
.titlecard{
  place-items:center;
}
.titlewrap{
  width:min(84vw,1120px);
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:32px;
  align-items:end;
}
.titlebig{
  font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;
  font-size:clamp(64px,12vw,180px);
  line-height:.78;
  letter-spacing:-.08em;
  font-weight:600;
}
.titlemeta{
  padding-bottom:8px;
  font-size:8px;
  line-height:1.55;
  letter-spacing:.08em;
  text-transform:uppercase;
  color:#777;
}
.rule{
  width:36px;
  height:2px;
  background:var(--orange);
  margin-bottom:14px;
}

.endcard{
  grid-template-rows:1fr auto;
  padding:22px 24px 20px;
}
.endmain{
  display:grid;
  align-content:center;
}
.endeyebrow{
  font-size:8px;
  letter-spacing:.08em;
  text-transform:uppercase;
  color:#777;
  margin-bottom:18px;
}
.endline{
  font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;
  font-size:clamp(62px,10.7vw,160px);
  line-height:.8;
  letter-spacing:-.075em;
  font-weight:600;
}
.endbottom{
  border-top:1px solid rgba(17,17,17,.18);
  padding-top:12px;
  display:grid;
  grid-template-columns:1fr auto;
  align-items:end;
}
.endnav{
  display:flex;
  gap:18px;
  font-size:8px;
  letter-spacing:.08em;
  text-transform:uppercase;
}
.endnav a:hover{color:var(--orange)}
.endcredit{
  text-align:right;
  font-size:7px;
  line-height:1.45;
  letter-spacing:.08em;
  text-transform:uppercase;
  color:#777;
}

.hotzone{
  position:absolute;
  inset:0;
  z-index:2;
}
.progress{
  position:absolute;
  left:20px;
  right:20px;
  bottom:7px;
  height:1px;
  background:rgba(255,255,255,.14);
  z-index:2;
}
.progress span{
  display:block;
  height:100%;
  width:0;
  background:var(--white);
  transition:width .18s ease;
}

@media(max-width:760px){
  .ui{padding:14px}
  .index{display:none}
  .copy{
    left:18px;
    right:18px;
    bottom:15vh;
    max-width:none;
    font-size:clamp(38px,12vw,64px);
  }
  .copy.quiet{font-size:clamp(24px,8vw,40px)}
  .note{display:none}
  .titlewrap{
    width:calc(100vw - 36px);
    grid-template-columns:1fr;
    gap:18px;
  }
  .titlebig{font-size:clamp(62px,22vw,112px)}
  .endcard{padding:18px}
  .endline{font-size:clamp(62px,20vw,112px)}
  .endnav{gap:12px;flex-wrap:wrap}
  .endcredit{font-size:6px}
  .progress{left:14px;right:14px}
}
</style>
</head>
<body>
<main class="stage" id="stage">
  <img class="image" id="image" src="../field-notes-assets/barnsley.webp" alt="">
  <div class="scrim"></div>

  <div class="ui">
    <div class="top">
      <div class="brand">FREEMAN</div>
      <div class="index" id="index">01 / 08</div>
      <div class="navhint">CLICK / →<br>← BACK</div>
    </div>

    <div></div>

    <div class="bottom">
      <div class="caption" id="caption">Barnsley Resort<br>Adairsville, Georgia</div>
      <div class="note" id="note"></div>
      <div class="counter" id="counter">FIELD 01</div>
    </div>
  </div>

  <div class="copy empty" id="copy"></div>

  <section class="titlecard active" id="titlecard">
    <div class="titlewrap">
      <div>
        <div class="rule"></div>
        <div class="titlebig">THE<br>WORK.</div>
      </div>
      <div class="titlemeta">
        FREEMAN GENERAL CONTRACTING<br>
        CARTERSVILLE, GEORGIA<br><br>
        A SHORT FIELD SEQUENCE.<br>
        CLICK TO BEGIN.
      </div>
    </div>
  </section>

  <section class="endcard" id="endcard">
    <div class="endmain">
      <div class="endeyebrow">Freeman General Contracting</div>
      <div class="endline">BUILT FOR<br>GENERATIONS.</div>
    </div>
    <div class="endbottom">
      <nav class="endnav">
        <a href="../v3-study.html">Work</a>
        <a href="../archive/">Archive</a>
        <a href="#">Company</a>
        <a href="../portal.html">Client Portal</a>
      </nav>
      <div class="endcredit">Cartersville, Georgia<br>Freeman GC</div>
    </div>
  </section>

  <div class="hotzone" id="hotzone"></div>
  <div class="progress"><span id="bar"></span></div>
</main>

<script>
const slides = [
  {
    src:'../field-notes-assets/site.webp',
    caption:'Existing condition<br>Georgia',
    counter:'FIELD 01',
    copy:'',
    note:''
  },
  {
    src:'../field-notes-assets/steelwork.webp',
    caption:'Structure<br>North Georgia',
    counter:'FIELD 02',
    copy:'Most of the work is gone before anyone arrives.',
    quiet:true,
    note:''
  },
  {
    src:'../field-notes-assets/timber.webp',
    caption:'Framing + hidden systems<br>North Georgia',
    counter:'FIELD 03',
    copy:'',
    note:''
  },
  {
    src:'../field-notes-assets/barnsley.webp',
    caption:'Barnsley Resort<br>Adairsville, Georgia',
    counter:'FIELD 04',
    copy:'This is where the decisions live.',
    quiet:false,
    note:''
  },
  {
    src:'../field-notes-assets/steelwork.webp',
    caption:'Coordination<br>North Georgia',
    counter:'FIELD 05',
    copy:'',
    note:''
  },
  {
    src:'../field-notes-assets/optimist-detail.webp',
    caption:'The Optimist<br>Atlanta, Georgia',
    counter:'RESULT 01',
    copy:'Then the evidence disappears.',
    quiet:false,
    note:''
  },
  {
    src:'../field-notes-assets/optimist.webp',
    caption:'The Optimist<br>Atlanta, Georgia',
    counter:'RESULT 02',
    copy:'',
    note:''
  },
  {
    src:'../field-notes-assets/barnsley.webp',
    caption:'Freeman General Contracting<br>Georgia',
    counter:'RECORD 01',
    copy:'The room is what remains.',
    quiet:false,
    note:''
  }
];

let i = -1;
let started = false;
let ended = false;

const stage = document.getElementById('stage');
const titlecard = document.getElementById('titlecard');
const endcard = document.getElementById('endcard');
const image = document.getElementById('image');
const copy = document.getElementById('copy');
const caption = document.getElementById('caption');
const counter = document.getElementById('counter');
const index = document.getElementById('index');
const note = document.getElementById('note');
const bar = document.getElementById('bar');
const hotzone = document.getElementById('hotzone');

function render(){
  const s = slides[i];
  stage.dataset.mode='image';
  endcard.classList.remove('active');
  image.style.opacity='0';
  requestAnimationFrame(()=>{
    image.src=s.src;
    image.onload=()=>{ image.style.opacity='1'; };
  });
  caption.innerHTML=s.caption;
  counter.textContent=s.counter;
  index.textContent=String(i+1).padStart(2,'0')+' / '+String(slides.length).padStart(2,'0');
  note.textContent=s.note||'';
  copy.textContent=s.copy||'';
  copy.className='copy'+(s.copy?'':' empty')+(s.quiet?' quiet':'');
  bar.style.width=((i+1)/slides.length*100)+'%';
}

function next(){
  if(!started){
    started=true;
    titlecard.classList.remove('active');
    i=0;
    render();
    return;
  }
  if(ended) return;
  if(i<slides.length-1){
    i++;
    render();
  }else{
    ended=true;
    stage.dataset.mode='end';
    endcard.classList.add('active');
    bar.style.width='100%';
  }
}

function prev(){
  if(!started) return;
  if(ended){
    ended=false;
    endcard.classList.remove('active');
    i=slides.length-1;
    render();
    return;
  }
  if(i>0){
    i--;
    render();
  }else{
    started=false;
    i=-1;
    stage.dataset.mode='title';
    titlecard.classList.add('active');
    bar.style.width='0';
  }
}

hotzone.addEventListener('click',next);
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight' || e.key===' ' || e.key==='Enter') next();
  if(e.key==='ArrowLeft') prev();
});
</script>
</body>
</html>

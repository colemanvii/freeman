<title>Built for Generations</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Franklin:ital,wght@0,300..700;1,300..700&display=swap">
<style>
/* Layout: a printed treatment. One left-hung column of chapters on Freeman paper, hairlines and small
   tracked caps from the approved site; photographs run as wide plates; the film itself lives on a dark
   "screening" ground. Red is punctuation only: the current chapter, one mark per drawing, the ask. */
:root{
  --paper:#fff9f1; --ink:#332e20; --muted:#6f6858; --hair:#d9d0c2; --sand:#efe6d6; --red:#f93822; --red-text:#d42c18;
  --screen:#1f1b12; --screen-ink:#fff9f1; --screen-muted:#b9ae9b; --screen-hair:#4d463a; --screen-fill:#2b2619;
  --gothic:"Libre Franklin","Franklin Gothic Book","Franklin Gothic Medium",Arial,sans-serif;
  --mono:Menlo,Monaco,"DejaVu Sans Mono",Consolas,monospace;
  --gut:max(20px,env(safe-area-inset-left,0px)); --gutr:max(20px,env(safe-area-inset-right,0px));
  --measure:34em; --wide:1180px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#1f1b12; --ink:#fff9f1; --muted:#b9ae9b; --hair:#4d463a; --sand:#2b2619; --red:#f93822; --red-text:#ff6a55;
  --screen:#14110b; --screen-ink:#fff9f1; --screen-muted:#b9ae9b; --screen-hair:#4d463a; --screen-fill:#221d14; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#1f1b12; --ink:#fff9f1; --muted:#b9ae9b; --hair:#4d463a; --sand:#2b2619; --red:#f93822; --red-text:#ff6a55;
  --screen:#14110b; --screen-ink:#fff9f1; --screen-muted:#b9ae9b; --screen-hair:#4d463a; --screen-fill:#221d14; color-scheme:dark}

*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:64px}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
body{background:var(--paper);color:var(--ink);font-family:var(--gothic);font-size:16px;line-height:1.6;font-kerning:normal;font-synthesis:none;-webkit-font-smoothing:antialiased;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
a{color:inherit;text-decoration-color:var(--red);text-underline-offset:.2em;text-decoration-thickness:1px}
a:hover{color:var(--red-text)}
:focus-visible{outline:2px solid var(--red);outline-offset:3px}
p{margin:0}
h1,h2,h3,h4{margin:0;font-weight:400;text-wrap:balance}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
img{display:block;width:100%;height:auto}
.wrap{max-width:var(--wide);margin:0 auto;padding-left:var(--gut);padding-right:var(--gutr)}

/* type roles */
.lab{font-size:11px;font-weight:500;letter-spacing:.09em;text-transform:uppercase;line-height:1.5;color:var(--muted)}
.lab b{font-weight:600;color:var(--ink)}
.lab .r,.r{color:var(--red-text)}
.mono{font-family:var(--mono);font-size:.82em;letter-spacing:0;font-variant-numeric:tabular-nums}
.statement{font-size:clamp(28px,4.6vw,54px);line-height:1.08;letter-spacing:-.022em;max-width:20em}
.statement i{font-style:normal;color:var(--red-text)}
.lede{font-size:clamp(19px,2.1vw,24px);line-height:1.42;letter-spacing:-.008em;max-width:30em;text-wrap:pretty}
.body{max-width:var(--measure);display:grid;gap:1em;font-size:16.5px;line-height:1.62;text-wrap:pretty}
.small{font-size:13.5px;line-height:1.55;color:var(--muted);max-width:44em;text-wrap:pretty}
.small b{color:var(--ink);font-weight:600}
h3.h{font-size:11px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--ink)}
h3.t{font-size:clamp(22px,2.6vw,30px);line-height:1.15;letter-spacing:-.015em}

/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--paper);border-bottom:1px solid var(--hair)}
.bar .wrap{display:flex;align-items:center;gap:24px;height:48px}
.bar .name{white-space:nowrap;flex:none}
.bar nav{margin-left:auto;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;min-width:0}
.bar nav::-webkit-scrollbar{display:none}
.bar nav a{flex:none;text-decoration:none;padding:14px 9px;font-size:11px;font-weight:500;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.bar nav a .n{font-family:var(--mono);font-size:10.5px;letter-spacing:0}
.bar nav a .w{display:none;margin-left:6px}
.bar nav a[aria-current="true"]{color:var(--red-text)}
.bar nav a[aria-current="true"] .w{display:inline}
@media (max-width:700px){.bar .name span{display:none}.bar nav a{padding:14px 7px}.bar nav a[aria-current="true"] .w{display:none}}

/* chapters */
.ch{padding-block:clamp(64px,9vw,128px) 0}
.ch-head{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:baseline;border-top:1px solid var(--ink);padding-top:12px;margin-bottom:clamp(32px,5vw,64px)}
.ch-head .no{font-family:var(--mono);font-size:12px;color:var(--red-text)}
.ch-head h2{font-size:11px;font-weight:600;letter-spacing:.09em;text-transform:uppercase}
.stack{display:grid;grid-template-columns:minmax(0,1fr);gap:clamp(28px,4vw,48px)}
.stack-l{display:grid;grid-template-columns:minmax(0,1fr);gap:clamp(48px,7vw,96px)}
.two{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:clamp(24px,5vw,72px);align-items:start}
.two.even{grid-template-columns:repeat(2,minmax(0,1fr))}
.three{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(20px,3vw,40px)}
.three.four{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:820px){.two,.two.even,.three,.three.four{grid-template-columns:minmax(0,1fr)}}
.rule{border-top:1px solid var(--hair);padding-top:14px}
.col{display:grid;gap:12px;align-content:start;min-width:0}

/* plates (photographs) */
figure{margin:0}
.plate img{background:var(--sand)}
.plate figcaption,.cap{display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 18px;margin-top:9px;font-size:10.5px;font-weight:500;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);line-height:1.5}
.plate.crop img{aspect-ratio:var(--ar,16/9);object-fit:cover;object-position:var(--pos,50% 50%)}
.bleed{max-width:1480px;margin:0 auto}
.pair{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,5fr);gap:clamp(12px,2vw,24px);align-items:end}
.pair.rev{grid-template-columns:minmax(0,5fr) minmax(0,7fr)}
.trio{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(12px,2vw,24px);align-items:start}
@media (max-width:700px){.pair,.pair.rev{grid-template-columns:minmax(0,1fr)}.trio{grid-template-columns:repeat(2,minmax(0,1fr))}.trio>:first-child{grid-column:1/-1}}

/* hero */
.hero{padding-block:clamp(36px,6vw,72px) 0}
.hero .sig{width:clamp(150px,20vw,230px);color:var(--ink);display:block}
.hero h1{font-size:clamp(46px,10.4vw,148px);line-height:.93;letter-spacing:-.04em;margin-top:clamp(28px,5vw,56px)}
.hero h1 i{font-style:normal;color:var(--red)}
.hero .sub{margin-top:clamp(18px,2.4vw,28px);font-size:clamp(19px,2.3vw,27px);letter-spacing:-.01em}
.hero .meta{margin-top:clamp(28px,4vw,48px);display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px 24px;border-top:1px solid var(--hair);padding-top:14px}
.hero .meta div{display:grid;gap:2px}
.hero .meta .v{font-size:14.5px}
@media (max-width:700px){.hero .meta{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* five-figure row */
.figs{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));border-top:1px solid var(--ink);border-bottom:1px solid var(--hair)}
.figs>div{padding:16px 16px 18px 0;display:grid;gap:6px;align-content:start;border-left:1px solid var(--hair);padding-left:16px}
.figs>div:first-child{border-left:0;padding-left:0}
.figs .n{white-space:nowrap;font-size:clamp(26px,3.6vw,48px);line-height:1;letter-spacing:-.03em;font-variant-numeric:tabular-nums lining-nums}
.figs .d{font-size:13px;line-height:1.45;color:var(--muted)}
@media (max-width:820px){.figs{grid-template-columns:repeat(2,minmax(0,1fr))}.figs>div{border-top:1px solid var(--hair)}.figs>div:nth-child(odd){border-left:0;padding-left:0}.figs>div:nth-child(-n+2){border-top:0}.figs>div:last-child{grid-column:1/-1}}

/* definition rows / registers */
.rows{display:grid;border-top:1px solid var(--ink)}
.row{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,9fr);gap:8px 32px;padding:16px 0;border-bottom:1px solid var(--hair);align-items:baseline}
.row>.k{font-size:11px;font-weight:600;letter-spacing:.09em;text-transform:uppercase}
.row>.v{font-size:15.5px;line-height:1.55;max-width:44em;text-wrap:pretty}
.row>.v .lab{display:block;margin-top:6px}
@media (max-width:700px){.row{grid-template-columns:minmax(0,1fr)}}

/* evidence tags */
.tag{display:inline-block;font-family:var(--mono);font-size:10px;letter-spacing:.02em;text-transform:uppercase;padding:1px 6px;border:1px solid currentColor;white-space:nowrap;vertical-align:.12em;margin-right:6px}
.tag.v{color:var(--ink)}
.tag.i{color:var(--muted);border-style:dashed}
.tag.u{color:var(--red-text)}
.tag.e{color:var(--muted);border-style:dashed}

/* lists */
ul.plain{list-style:none;margin:0;padding:0;display:grid;gap:9px}
ul.plain li{padding-left:18px;position:relative;font-size:15px;line-height:1.5;text-wrap:pretty}
ul.plain li::before{content:"";position:absolute;left:0;top:.72em;width:8px;height:1px;background:var(--ink)}
ul.plain.no li::before{background:var(--red)}

/* tables */
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;font-size:14px;line-height:1.45}
th{font-size:10.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;text-align:left;color:var(--muted);padding:8px 14px 8px 0;border-bottom:1px solid var(--ink);white-space:nowrap;vertical-align:bottom}
td{padding:11px 14px 11px 0;border-bottom:1px solid var(--hair);vertical-align:top}
td.num,th.num{text-align:right;font-family:var(--mono);font-size:13px;font-variant-numeric:tabular-nums;white-space:nowrap;padding-right:0}
td.n{font-family:var(--mono);font-size:12px;color:var(--muted);white-space:nowrap}
tr.total td{border-top:1px solid var(--ink);border-bottom:1px solid var(--ink);font-weight:600}
tr.sub td{color:var(--muted);font-size:13px}

/* Represent references */
.refs{display:grid;border-top:1px solid var(--ink)}
.ref{display:grid;grid-template-columns:34px minmax(0,4fr) minmax(0,7fr);gap:6px 24px;padding:16px 0;border-bottom:1px solid var(--hair);align-items:baseline}
.ref .n{font-family:var(--mono);font-size:12px;color:var(--muted)}
.ref .ti{font-size:16px;line-height:1.3;font-weight:500}
.ref .ti a{text-decoration-color:var(--hair)}
.ref .ti a:hover{text-decoration-color:var(--red)}
.ref .mt{display:block;margin-top:5px}
.ref .tx{font-size:14.5px;line-height:1.55;text-wrap:pretty}
.ref .tx em{display:block;font-style:normal;color:var(--muted);margin-top:6px;font-size:13.5px}
@media (max-width:820px){.ref{grid-template-columns:28px minmax(0,1fr)}.ref .tx{grid-column:2}}

/* films register */
.films{display:grid;border-top:1px solid var(--ink)}
.film{border-bottom:1px solid var(--hair)}
.film>summary{list-style:none;display:grid;grid-template-columns:54px minmax(0,4fr) minmax(0,7fr) 24px;gap:6px 24px;padding:20px 0;cursor:pointer;align-items:baseline}
.film>summary::-webkit-details-marker{display:none}
.film .no{font-family:var(--mono);font-size:12px;color:var(--red-text)}
.film .ti{font-size:clamp(22px,2.8vw,32px);line-height:1.1;letter-spacing:-.018em}
.film .q{font-size:15.5px;line-height:1.5;text-wrap:pretty}
.film .pm{font-family:var(--mono);font-size:15px;color:var(--muted);text-align:right}
.film[open] .pm::before{content:"−"}.film:not([open]) .pm::before{content:"+"}
.film .more{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px 32px;padding:4px 0 28px 78px}
.film .more p{font-size:14.5px;line-height:1.55;text-wrap:pretty}
.film .more .lab{margin-bottom:5px;display:block}
@media (max-width:820px){.film>summary{grid-template-columns:34px minmax(0,1fr) 20px}.film .q{grid-column:2}.film .pm{grid-row:1;grid-column:3}.film .more{grid-template-columns:minmax(0,1fr);padding-left:58px}}
@media (max-width:480px){.film .more{padding-left:0}}

/* three openings */
.opens{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-top:1px solid var(--ink)}
.open{padding:18px 24px 22px 0;display:grid;gap:12px;align-content:start;border-left:1px solid var(--hair);padding-left:24px}
.open:first-child{border-left:0;padding-left:0}
.open h4{font-size:24px;letter-spacing:-.015em;line-height:1.1}
.open p{font-size:14.5px;line-height:1.55;text-wrap:pretty}
.open.rec{border-top:3px solid var(--red);margin-top:-2px}
@media (max-width:820px){.opens{grid-template-columns:minmax(0,1fr)}.open{border-left:0;padding-left:0;border-bottom:1px solid var(--hair)}}

/* the screening ground: opening film */
.screen{background:var(--screen);color:var(--screen-ink);margin-top:clamp(64px,9vw,128px);padding-block:clamp(48px,7vw,96px)}
.screen .lab{color:var(--screen-muted)}.screen .lab b{color:var(--screen-ink)}
.screen .small{color:var(--screen-muted)}.screen .small b{color:var(--screen-ink)}
.screen .rule{border-color:var(--screen-hair)}
.screen h3.h{color:var(--screen-ink)}
.screen td{border-color:var(--screen-hair)}.screen th{border-color:var(--screen-ink);color:var(--screen-muted)}
.screen td.n{color:var(--screen-muted)}
.screen ul.plain li::before{background:var(--screen-ink)}
.screen ul.plain.no li::before{background:var(--red)}
.screen .r{color:#ff6a55}
.filmtitle{font-size:clamp(44px,9vw,120px);line-height:.95;letter-spacing:-.04em}
.acts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(20px,3vw,40px)}
.acts p{font-size:15px;line-height:1.6;text-wrap:pretty}
@media (max-width:820px){.acts{grid-template-columns:minmax(0,1fr)}}

/* storyboard */
.board{display:grid;grid-template-columns:minmax(0,8fr) minmax(0,4fr);gap:clamp(20px,3vw,40px);align-items:start}
.board .frame{background:var(--paper-fixed,#fff9f1);color:#332e20;aspect-ratio:16/9;width:100%;display:block}
.board .frame svg{width:100%;height:100%;display:block}
.board .info{display:grid;gap:14px;align-content:start;min-width:0}
.board .info h4{font-size:clamp(24px,2.8vw,34px);line-height:1.08;letter-spacing:-.02em}
.board .info .act{font-size:15.5px;line-height:1.55;text-wrap:pretty}
.board dl{margin:0;display:grid;gap:0;border-top:1px solid var(--screen-hair)}
.board dl div{display:grid;grid-template-columns:76px minmax(0,1fr);gap:10px;padding:8px 0;border-bottom:1px solid var(--screen-hair);font-size:13.5px;line-height:1.45}
.board dt{font-size:10.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--screen-muted);padding-top:2px}
.board dd{margin:0}
.board .ctl{display:flex;align-items:center;gap:8px;margin-top:10px}
.board .ctl button{min-width:44px;height:44px;border:1px solid var(--screen-hair);font-size:11px;font-weight:500;letter-spacing:.09em;text-transform:uppercase;padding:0 14px}
.board .ctl button:hover{border-color:var(--screen-ink)}
.board .ctl .count{margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--screen-muted)}
.strip{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:6px;margin-top:14px}
.strip button{background:#fff9f1;color:#332e20;aspect-ratio:16/9;opacity:.42;position:relative;display:block}
.strip button svg{width:100%;height:100%;display:block}
.strip button[aria-pressed="true"]{opacity:1;outline:2px solid var(--red);outline-offset:2px}
.strip button:hover{opacity:.85}
@media (max-width:820px){.board{grid-template-columns:minmax(0,1fr)}.strip{grid-template-columns:repeat(6,minmax(0,1fr))}}
.sb-l{vector-effect:non-scaling-stroke;fill:none;stroke:#332e20;stroke-width:1.1;stroke-linecap:round;stroke-linejoin:round}
.sb-t{vector-effect:non-scaling-stroke;fill:none;stroke:#332e20;stroke-width:.6;stroke-linecap:round;opacity:.55}
.sb-f{vector-effect:non-scaling-stroke;fill:#332e20;stroke:none}
.sb-g{vector-effect:non-scaling-stroke;fill:#332e20;opacity:.1;stroke:none}
.sb-g2{vector-effect:non-scaling-stroke;fill:#332e20;opacity:.22;stroke:none}
.sb-p{vector-effect:non-scaling-stroke;fill:#fff9f1;stroke:#332e20;stroke-width:1.1;stroke-linejoin:round}
.sb-rd{vector-effect:non-scaling-stroke;fill:#f93822;stroke:none}
.sb-rl{vector-effect:non-scaling-stroke;fill:none;stroke:#f93822;stroke-width:1.2;stroke-linecap:round}
svg.sb text{font-family:Menlo,Monaco,monospace;font-size:7px;fill:#332e20}

/* approach: month diagram */
.month{border-top:1px solid var(--ink);padding-top:16px}
.month svg{width:100%;height:auto;display:block;min-width:640px}
.month svg text{font-family:var(--gothic);font-size:11px;fill:var(--muted);letter-spacing:.06em}
.month svg .ink{stroke:var(--ink);fill:none}.month svg .hair{stroke:var(--hair);fill:none}
.month svg .fi{fill:var(--ink)}.month svg .fr{fill:var(--red)}.month svg .ti{fill:var(--ink);font-weight:600}

/* schedule */
.sched td,.sched th{padding-right:10px}
.sched td{font-size:13px}
.sched .on{background:var(--ink);height:8px;display:block}
.sched .crew{background:var(--red);height:8px;width:22%;display:block}
.sched .half{background:var(--ink);height:8px;width:50%;display:block}
.sched .half.r{margin-left:50%}
.sched .dot{width:8px;height:8px;background:var(--red);display:block;border-radius:50%;margin-left:70%}
.sched td.cell{padding:14px 4px 14px 0;vertical-align:middle;min-width:92px}

/* budget */
.scope{display:flex;flex-wrap:wrap;gap:0;border:1px solid var(--ink);width:fit-content;max-width:100%}
.scope button{padding:12px 18px;min-height:44px;font-size:11px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;border-left:1px solid var(--ink)}
.scope button:first-child{border-left:0}
.scope button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.allin{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px;border-top:1px solid var(--ink);border-bottom:1px solid var(--ink);padding:18px 0}
.allin .n{font-size:clamp(28px,4.2vw,52px);line-height:1;letter-spacing:-.03em;font-variant-numeric:tabular-nums lining-nums}
.allin .d{font-size:13px;color:var(--muted);margin-top:8px;line-height:1.45}
@media (max-width:600px){.allin{grid-template-columns:minmax(0,1fr)}}

/* evaluation */
.evals{display:grid;border-top:1px solid var(--ink)}
.eval{display:grid;grid-template-columns:34px minmax(0,4fr) minmax(0,4fr) minmax(0,4fr);gap:8px 28px;padding:20px 0;border-bottom:1px solid var(--hair);align-items:start}
.eval .n{font-family:var(--mono);font-size:12px;color:var(--red-text);padding-top:5px}
.eval h4{font-size:21px;line-height:1.15;letter-spacing:-.012em}
.eval .qq{font-size:14.5px;line-height:1.5;margin-top:8px;color:var(--muted);text-wrap:pretty}
@media (max-width:820px){.eval{grid-template-columns:28px minmax(0,1fr)}.eval>div:nth-child(n+3){grid-column:2}}

/* decision */
.ask{border:1px solid var(--ink);padding:clamp(20px,3.4vw,40px);display:grid;gap:22px}
.ask ol{margin:0;padding:0;list-style:none;display:grid;gap:0;counter-reset:a}
.ask ol li{counter-increment:a;display:grid;grid-template-columns:34px minmax(0,1fr);gap:10px;padding:14px 0;border-top:1px solid var(--hair);font-size:clamp(17px,1.9vw,21px);line-height:1.35;text-wrap:pretty}
.ask ol li::before{content:"0" counter(a);font-family:var(--mono);font-size:12px;color:var(--red-text);padding-top:.4em}
.call{display:grid;gap:14px}
.call .opts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.call .opts button{border:1px solid var(--ink);padding:14px 16px;min-height:64px;text-align:left;display:grid;gap:3px;align-content:start}
.call .opts button b{font-size:11px;font-weight:600;letter-spacing:.09em;text-transform:uppercase}
.call .opts button span{font-size:13px;color:var(--muted);line-height:1.4}
.call .opts button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.call .opts button[aria-pressed="true"] span{color:var(--paper);opacity:.75}
.call .opts button:first-child[aria-pressed="true"]{background:var(--red);border-color:var(--red);color:#fff9f1}
.call textarea{width:100%;min-height:92px;font:inherit;font-size:15px;line-height:1.5;color:var(--ink);background:transparent;border:1px solid var(--hair);padding:12px;border-radius:0;resize:vertical}
.call textarea:focus{border-color:var(--ink);outline:none}
.call .save{justify-self:start;border:1px solid var(--ink);padding:0 20px;height:44px;font-size:11px;font-weight:600;letter-spacing:.09em;text-transform:uppercase}
.call .save:hover{background:var(--ink);color:var(--paper)}
.call .status{font-size:13px;color:var(--muted);min-height:1.5em}
@media (max-width:700px){.call .opts{grid-template-columns:minmax(0,1fr)}}

/* appendix */
.apx details{border-bottom:1px solid var(--hair)}
.apx details:first-of-type{border-top:1px solid var(--ink)}
.apx summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;gap:16px;padding:16px 0;font-size:11px;font-weight:600;letter-spacing:.09em;text-transform:uppercase}
.apx summary::-webkit-details-marker{display:none}
.apx summary::after{content:"+";font-family:var(--mono);font-size:14px;color:var(--muted)}
.apx details[open] summary::after{content:"−"}
.apx .in{padding:4px 0 28px;display:grid;gap:18px}
.apx .in p,.apx .in li{font-size:14.5px;line-height:1.6;max-width:52em;text-wrap:pretty}
.apx .in h4{font-size:11px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;margin-top:8px}
.apx ol,.apx ul{margin:0;padding-left:1.2em;display:grid;gap:8px}
.apx a{word-break:break-word}

footer{margin-top:clamp(64px,9vw,128px);border-top:1px solid var(--ink);padding-block:18px 48px}
footer .wrap{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px 32px;align-items:end}
footer .eagle{width:120px;color:var(--red)}
</style>

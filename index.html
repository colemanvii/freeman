<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Freeman — V3 Study</title>
<meta name="theme-color" content="#f4f5f5" />
<style>
:root{
  --paper:#f4f5f5;
  --line:#dde0e1;
  --ink:#111415;
  --muted:#7b8083;
  --accent:#ff5a1f;
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:var(--paper);color:var(--ink);overflow:hidden}
body{
  font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit}
.stage{
  width:100vw;
  height:100dvh;
  padding:16px 20px 14px;
  display:grid;
  grid-template-rows:auto 1fr auto;
  gap:10px;
}
.top{
  display:grid;
  grid-template-columns:1fr auto 1fr;
  align-items:start;
  min-height:28px;
}
.wordmark{
  font-size:12.5px;
  line-height:1;
  font-weight:700;
  letter-spacing:-.045em;
}
.issue{
  justify-self:center;
  font-size:8px;
  line-height:1;
  letter-spacing:.17em;
  color:var(--muted);
}
.nav{
  justify-self:end;
  display:flex;
  gap:20px;
  align-items:center;
  font-size:8px;
  line-height:1;
  letter-spacing:.09em;
  text-transform:uppercase;
}
.nav a{color:inherit;text-decoration:none}
.portal:before{
  content:"";
  display:inline-block;
  width:5px;height:5px;
  margin-right:7px;
  border-radius:50%;
  background:var(--accent);
  vertical-align:1px;
}
.viewer{
  min-height:0;
  border-top:1px solid var(--line);
  border-bottom:1px solid var(--line);
  display:grid;
  grid-template-columns:minmax(0,1fr) 190px;
}
.image-wrap{
  position:relative;
  min-width:0;
  min-height:0;
  overflow:hidden;
  background:#e8eaeb;
}
.image-wrap img{
  display:block;
  width:100%;
  height:100%;
  object-fit:cover;
  object-position:center;
  filter:contrast(1.035) saturate(.92);
  transform:scale(1.001);
}
.index{
  position:absolute;
  left:12px;
  bottom:10px;
  color:#fff;
  mix-blend-mode:difference;
  font-size:9px;
  letter-spacing:.12em;
  user-select:none;
}
.side{
  border-left:1px solid var(--line);
  padding:9px 10px 10px;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
  min-width:0;
}
.meta{display:grid;gap:9px}
.meta-block{border-top:1px solid var(--line);padding-top:6px}
.meta-block:first-child{border-top:0;padding-top:0}
.k{
  display:block;
  font-size:7px;
  letter-spacing:.14em;
  text-transform:uppercase;
  color:var(--muted);
  margin-bottom:3px;
}
.v{display:block;font-size:9px;line-height:1.22}
.controls{
  display:grid;
  grid-template-columns:1fr 1fr;
  border-top:1px solid var(--line);
}
.controls button{
  appearance:none;
  border:0;
  background:transparent;
  height:30px;
  padding:0;
  font-size:10px;
  cursor:pointer;
}
.controls button+button{border-left:1px solid var(--line)}
.controls button:hover{background:#eceeee}
.bottom{
  display:grid;
  grid-template-columns:1fr auto 1fr;
  align-items:end;
  gap:16px;
}
.tagline{
  font-size:clamp(30px,4.65vw,74px);
  line-height:.86;
  font-weight:400;
  letter-spacing:-.06em;
  white-space:nowrap;
}
.center-note{
  justify-self:center;
  font-size:7px;
  letter-spacing:.14em;
  text-transform:uppercase;
  color:var(--muted);
  padding-bottom:2px;
}
.credit{
  justify-self:end;
  text-align:right;
  font-size:7px;
  line-height:1.3;
  letter-spacing:.1em;
  text-transform:uppercase;
  color:var(--muted);
  padding-bottom:2px;
}
@media(max-width:760px){
  .stage{padding:11px 12px 10px;gap:8px}
  .top{grid-template-columns:1fr auto;min-height:24px}
  .issue{display:none}
  .wordmark{font-size:12px}
  .nav{gap:11px;font-size:7px}
  .viewer{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) 74px}
  .side{
    border-left:0;
    border-top:1px solid var(--line);
    padding:7px 0 0;
    display:grid;
    grid-template-columns:1fr 82px;
    gap:8px;
  }
  .meta{grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}
  .meta-block{border-top:0;padding-top:0}
  .meta-block:nth-child(n+4){display:none}
  .k{font-size:6px}
  .v{font-size:8px}
  .controls{align-self:end}
  .controls button{height:28px;font-size:9px}
  .bottom{grid-template-columns:1fr auto;gap:10px}
  .center-note{display:none}
  .tagline{font-size:clamp(28px,9.6vw,48px);line-height:.88}
  .credit{font-size:6px}
}
</style>
</head>
<body>
<main class="stage">
  <header class="top">
    <div class="wordmark">FREEMAN</div>
    <div class="issue">FIELD RECORD / 001</div>
    <nav class="nav">
      <a href="v2.html">Archive</a>
      <a class="portal" href="portal.html">Client Portal</a>
    </nav>
  </header>
  <section class="viewer" aria-label="Freeman field record">
    <figure class="image-wrap" style="margin:0">
      <img id="frame" src="field-notes-assets/barnsley.webp" alt="Freeman construction field photograph">
      <div class="index" id="imageIndex">01 / 06</div>
    </figure>
    <aside class="side">
      <div class="meta">
        <div class="meta-block"><span class="k">Project</span><span class="v" id="project">Barnsley Resort</span></div>
        <div class="meta-block"><span class="k">Place</span><span class="v" id="place">Adairsville, Georgia</span></div>
        <div class="meta-block"><span class="k">Year</span><span class="v" id="record">2026</span></div>
        <div class="meta-block"><span class="k">Subject</span><span class="v" id="subject">Work in progress</span></div>
        <div class="meta-block"><span class="k">Builder</span><span class="v">Freeman General Contracting</span></div>
      </div>
      <div class="controls">
        <button id="prev" aria-label="Previous photograph">←</button>
        <button id="next" aria-label="Next photograph">→</button>
      </div>
    </aside>
  </section>
  <footer class="bottom">
    <div class="tagline">Built for Generations.</div>
    <div class="center-note">Construction / Hospitality / South</div>
    <div class="credit">Cartersville, Georgia<br>Freeman General Contracting</div>
  </footer>
</main>
<script>
const frames=[
  {src:'field-notes-assets/barnsley.webp',project:'Barnsley Resort',place:'Adairsville, Georgia',record:'2026',subject:'Work in progress'},
  {src:'field-notes-assets/steelwork.webp',project:'Field Study',place:'North Georgia',record:'2026',subject:'Steelwork'},
  {src:'field-notes-assets/timber.webp',project:'Field Study',place:'North Georgia',record:'2026',subject:'Timber'},
  {src:'field-notes-assets/optimist.webp',project:'The Optimist',place:'Atlanta, Georgia',record:'Record',subject:'Hospitality'},
  {src:'field-notes-assets/optimist-detail.webp',project:'The Optimist',place:'Atlanta, Georgia',record:'Record',subject:'Finished detail'},
  {src:'field-notes-assets/site.webp',project:'Field Study',place:'Georgia',record:'2026',subject:'Construction'}
];
let i=0;
const img=document.getElementById('frame');
const project=document.getElementById('project');
const place=document.getElementById('place');
const record=document.getElementById('record');
const subject=document.getElementById('subject');
const imageIndex=document.getElementById('imageIndex');
function render(){
  const f=frames[i];
  img.src=f.src;project.textContent=f.project;place.textContent=f.place;
  record.textContent=f.record;subject.textContent=f.subject;
  imageIndex.textContent=String(i+1).padStart(2,'0')+' / '+String(frames.length).padStart(2,'0');
}
document.getElementById('next').onclick=()=>{i=(i+1)%frames.length;render()};
document.getElementById('prev').onclick=()=>{i=(i-1+frames.length)%frames.length;render()};
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'){i=(i+1)%frames.length;render()}
  if(e.key==='ArrowLeft'){i=(i-1+frames.length)%frames.length;render()}
});
</script>
</body>
</html>

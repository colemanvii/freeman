<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Freeman GC</title>
<meta name="theme-color" content="#f4f4f1" />
<style>
:root{
  --paper:#f4f4f1;
  --ink:#242424;
  --muted:#777873;
  --slash:#a4a49f;
  --accent:#e75a28;
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:var(--paper);color:var(--ink)}
body{
  overflow:hidden;
  font-family:Monaco,"Courier New",monospace;
  -webkit-font-smoothing:antialiased;
}
.page{
  min-height:100dvh;
  position:relative;
}
.nav{
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  display:flex;
  align-items:baseline;
  gap:17px;
  white-space:nowrap;
  font-size:clamp(16px,1.5vw,22px);
  line-height:1;
  letter-spacing:-.025em;
}
.nav a{
  color:inherit;
  text-decoration:none;
}
.nav .brand{
  font-weight:700;
}
.nav .portal{
  color:var(--accent);
}
.slash{
  color:var(--slash);
}
.footer-left,.footer-right{
  position:absolute;
  bottom:24px;
  font-size:10px;
  line-height:1.5;
  letter-spacing:.07em;
  color:var(--muted);
  text-transform:uppercase;
}
.footer-left{left:30px}
.footer-right{right:30px;text-align:right}
@media(max-width:720px){
  .nav{
    width:calc(100vw - 36px);
    justify-content:center;
    flex-wrap:wrap;
    row-gap:15px;
    column-gap:12px;
    font-size:16px;
    line-height:1.3;
  }
  .footer-left,.footer-right{
    bottom:16px;
    font-size:9px;
  }
  .footer-left{left:16px}
  .footer-right{right:16px}
}

.sound-toggle{position:absolute;left:50%;bottom:24px;transform:translateX(-50%);border:0;background:none;color:var(--muted);font:inherit;font-size:12px;letter-spacing:.07em;cursor:pointer;padding:8px;text-transform:uppercase}
.sound-toggle:hover,.sound-toggle:focus-visible{color:var(--ink)}
.sound-panel{position:fixed;right:24px;bottom:63px;width:260px;padding:9px;background:var(--paper);border:1px solid var(--slash);box-shadow:0 8px 25px #00000016;z-index:5}
.sound-panel[hidden]{display:none}
.sound-panel iframe{display:block;width:240px;height:200px;border:0}
.sound-panel-label{display:flex;justify-content:space-between;align-items:center;padding:2px 0 8px;font-size:9px;letter-spacing:.02em}
.sound-close{border:0;background:none;font:inherit;color:var(--muted);cursor:pointer;padding:3px}
@media(max-width:720px){.sound-toggle{bottom:57px;font-size:11px}.sound-panel{right:12px;bottom:85px}}
</style>
</head>
<body>
<main class="page">
  <nav class="nav" aria-label="Primary">
    <a class="brand" href="/">FREEMAN GC</a>
    <span class="slash">/</span>
    <a href="#">COMPANY</a>
    <span class="slash">/</span>
    <a href="v3-study.html">WORK</a>
    <span class="slash">/</span>
    <a href="archive/">ARCHIVE</a>
    <span class="slash">/</span>
    <a href="proposal-study.html">PROPOSAL STUDY</a>
    <span class="slash">/</span>
    <a class="portal" href="onboarding.html">ONBOARDING</a>
    <span class="slash">/</span>
    <a href="portal.html">CLIENT PORTAL</a>
  </nav>

  <div class="footer-left">FREEMAN GENERAL CONTRACTORS<br>CARTERSVILLE, GEORGIA</div>
  <div class="footer-right">BUILT FOR GENERATIONS™<br>EST. IN GEORGIA</div>

  <button class="sound-toggle" id="sound-toggle" type="button" aria-pressed="false">♪ SOUND OFF</button>
  <audio id="sound-audio" preload="none"></audio>
</main>
<script>
(function(){
  const button=document.getElementById('sound-toggle');
  const audio=document.getElementById('sound-audio');
  let loaded=false,loading=false;
  audio.volume=0.5;
  function label(message){button.textContent=message;button.setAttribute('aria-label',message);button.setAttribute('aria-pressed',String(message==='♪ SOUND ON'));}
  audio.addEventListener('ended',()=>label('♪ SOUND OFF'));
  audio.addEventListener('error',()=>{loading=false;label('♪ AUDIO UNAVAILABLE');});
  button.addEventListener('click',async function(){
    if(!audio.paused){audio.pause();label('♪ SOUND OFF');return;}
    if(loading)return;
    if(!loaded){
      loading=true;label('♪ LOADING');
      try{
        // Official Apple Music sample, served as audio — no video or popup.
        const response=await fetch('https://itunes.apple.com/lookup?id=299545317&entity=song');
        if(!response.ok)throw new Error('Preview service unavailable');
        const data=await response.json();
        const preview=data.results?.find(track=>track.previewUrl)?.previewUrl;
        if(!preview)throw new Error('No authorized audio preview available');
        audio.src=preview;
        loaded=true;
      }catch(e){label('♪ AUDIO UNAVAILABLE');loading=false;return;}
      loading=false;
    }
    try{await audio.play();label('♪ SOUND ON');}
    catch(e){label('♪ AUDIO UNAVAILABLE');}
  });
})();
</script>
</body>
</html>

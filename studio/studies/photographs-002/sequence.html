<style>
/* Direction 02 — The Photographic Sequence.
   One photograph at a time, in a single column. Each frame has a declared scale and
   alignment; nothing is ever taller than the screen; the paper between frames is part of
   the composition. The phone is the native format: the same sequence, re-scaled, with
   the full frames running edge to edge. */
:root{--edge:clamp(24px,5vw,88px);--gap:clamp(8px,.8vw,12px);--air:clamp(88px,15vh,200px);--cap:calc(100svh - 150px)}
header{height:120px;display:flex;justify-content:center;align-items:center}
.eagle{display:inline-flex;min-width:88px;min-height:44px;align-items:center;justify-content:center;color:var(--ink)}
.eagle svg{display:block;width:68px;height:auto}
main{max-width:1600px;margin:0 auto;padding:0 var(--edge)}
/* A frame never exceeds its scale of the column, nor the height of the screen. */
.frame{display:flex;gap:var(--gap);width:min(calc(var(--s) * 1%), calc(var(--cap) * var(--sr) + var(--gaps)))}
.frame+.frame{margin-top:var(--air)}
.frame.l{margin-right:auto}.frame.r{margin-left:auto}.frame.c{margin-inline:auto}
.frame .tile{flex:var(--r) 1 0;min-width:0;aspect-ratio:var(--r)}
footer{display:flex;justify-content:center;padding:var(--air) 0 56px}
footer .eagle svg{width:40px;color:var(--muted)}
footer .eagle:hover svg{color:var(--ink)}
@media(max-width:700px){
  :root{--edge:18px;--gap:8px;--air:clamp(64px,12svh,104px);--cap:calc(100svh - 120px)}
  header{height:92px}
  .eagle svg{width:76px}
  /* On the phone a pair becomes two frames close together, so neither is a thumbnail. */
  .frame.pair{flex-direction:column}
  .frame.pair .tile{flex:none;width:100%}
  .frame.pair.keep{flex-direction:row}
  .frame.pair.keep .tile{flex:var(--r) 1 0;width:auto}
  .frame.bleed{width:auto;margin-inline:calc(-1 * var(--edge))}
}
</style></head><body>

/* The sequence, in curated order. Each entry: photographs, desktop [scale %, l|c|r],
   phone [scale %, l|c|r | "bleed"], and "keep" where a pair stays side by side on the phone.
   Scales are few on purpose: 100 / 76 / 56 / 38 on desktop, bleed / 100 / 80 / 62 on the phone. */
const SEQUENCE = [
  [["02"],       [100,"c"], ["bleed"]],   // the land: opens the record at full scale
  [["15"],       [56,"r"],  [80,"r"]],    // the people, quieter, to one side
  [["18","03"],  [100,"c"], [100,"c"]],   // the site and a man in it — read together
  [["07"],       [76,"l"],  [100,"c"]],   // the first warm interior
  [["08"],       [56,"r"],  [80,"r"]],
  [["01"],       [100,"c"], [100,"c"]],   // the ruin: as tall as the screen allows — a portrait with presence
  [["16"],       [56,"l"],  [80,"l"]],
  [["14","06"],  [100,"c"], [100,"c"]],   // the opening and the house it happened in
  [["05"],       [38,"r"],  [62,"r"]],    // W.C. — the smallest thing, given the most room
  [["04"],       [100,"c"], ["bleed"]],   // the fire
  [["17"],       [56,"l"],  [80,"l"]],
  [["09"],       [38,"r"],  [62,"r"]],    // the sconce
  [["13"],       [100,"c"], ["bleed"]],   // the dining room, the only wide frame
  [["11","10"],  [76,"c"],  [100,"c","keep"]],
  [["12"],       [76,"c"],  [100,"c"]]    // ends on one object
];
function render(phone){
  const main=document.querySelector("main"), frag=document.createDocumentFragment();
  let n=0;
  for(const [ids,desk,mob] of SEQUENCE){
    const f=document.createElement("div");
    const [s,a,keep]=phone?mob:desk;
    const bleed=phone&&s==="bleed";
    f.className="frame "+(bleed?"bleed":a)+(ids.length>1?" pair":"")+(keep?" keep":"");
    f.style.setProperty("--s",bleed?100:s);
    const stacked=phone&&ids.length>1&&!keep;
    // Height cap: a row's width at screen height is sum(ratios) x cap; a stacked pair is capped by its widest frame.
    const sr=stacked?Math.min(...ids.map(i=>PHOTOS[i])):ids.reduce((t,i)=>t+PHOTOS[i],0);
    f.style.setProperty("--sr",sr);
    f.style.setProperty("--gaps",stacked?"0px":`calc(var(--gap) * ${ids.length-1})`);
    const vw=bleed?100:Math.round((phone?s:s*0.9)/(stacked?1:ids.length));
    for(const id of ids) f.appendChild(tile(id,`${vw}vw`,n++<2));
    frag.appendChild(f);
  }
  main.replaceChildren(frag);
}
composeFor(render); initViewer();
</script>

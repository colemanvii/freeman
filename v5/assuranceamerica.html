<script>
/* Two viewing modes for the same Drive photographs. Collage is the default;
   scroll uses natural image ratios and zero side gutters on mobile. */
(() => {
  const buttons=[...document.querySelectorAll('[data-gallery-view]')];
  const key='freeman:assuranceamerica:mode';
  function setMode(mode,save=false){
    if(mode!=='collage'&&mode!=='scroll')mode='collage';
    document.body.dataset.galleryMode=mode;
    buttons.forEach(button=>button.setAttribute('aria-pressed',String(button.dataset.galleryView===mode)));
    if(save){try{localStorage.setItem(key,mode)}catch(e){}}
  }
  let saved='collage';
  try{saved=localStorage.getItem(key)||'collage'}catch(e){}
  setMode(saved);
  buttons.forEach(button=>button.addEventListener('click',()=>setMode(button.dataset.galleryView,true)));
})();
/* Same Drive collection at every width: editorial desktop sequence, dynamically
   balanced mobile rows. No hard-coded photo IDs, even when Drive changes. */
(() => {
 const main=document.querySelector('main');
 const bp=matchMedia('(max-width:700px)');
 const desktopRows=[...main.querySelectorAll('.photo-row')].map(row=>[...row.children]);
 const tiles=desktopRows.flat();
 const dialog=document.querySelector('dialog'),image=dialog.querySelector('.stage img');
 let active=0,startX=null,swiped=false;
 function mobileRows(){
   if(tiles.length<2)return [tiles];
   // Keep the photographic narrative, but fit groups to the narrow viewport.
   const n=tiles.length,dp=Array(n+1).fill(Infinity),steps=Array(n);
   dp[n]=0;
   for(let i=n-1;i>=0;i--){
     for(const count of [2,3]){
       if(i+count>n)continue;
       const group=tiles.slice(i,i+count);
       const sum=group.reduce((v,t)=>v+Math.max(.45,Math.min(3.1,Number(t.dataset.w)/Number(t.dataset.h)||1.5)),0);
       const cost=2.5*Math.log(sum/1.9)**2+(count===3?.12:0)+dp[i+count];
       if(cost<dp[i]){dp[i]=cost;steps[i]=count;}
     }
   }
   const rows=[];
   for(let i=0;i<n;){const count=steps[i]||n-i;rows.push(tiles.slice(i,i+count));i+=count;}
   return rows;
 }
 function arrange(){
   const groups=bp.matches?mobileRows():desktopRows;
   const fragment=document.createDocumentFragment();
   for(const group of groups){
     if(!group.length)continue;
     const row=document.createElement('div');row.className='photo-row';
     group.forEach(tile=>row.appendChild(tile));fragment.appendChild(row);
   }
   main.replaceChildren(fragment);
   if(dialog.open)dialog.close();
 }
 bp.addEventListener('change',arrange);
 arrange();
 function ordered(){return [...main.querySelectorAll('.tile')];}
 function show(index){
   const orderedTiles=ordered();
   if(!orderedTiles.length)return;
   active=(index+orderedTiles.length)%orderedTiles.length;
   image.src=orderedTiles[active].href;
   for(const offset of [-1,1]){
     const next=orderedTiles[(active+offset+orderedTiles.length)%orderedTiles.length];
     new Image().src=next.href;
   }
 }
 main.addEventListener('click',event=>{
   const tile=event.target.closest('.tile');
   if(!tile||event.metaKey||event.ctrlKey||event.shiftKey||event.altKey)return;
   event.preventDefault();
   show(ordered().indexOf(tile));dialog.showModal();
 });
 dialog.querySelector('.prev').addEventListener('click',()=>{if(!swiped)show(active-1);});
 dialog.querySelector('.next').addEventListener('click',()=>{if(!swiped)show(active+1);});
 dialog.querySelector('[data-close]').addEventListener('click',()=>dialog.close());
 image.addEventListener('click',()=>{if(!swiped)dialog.close();});
 dialog.addEventListener('close',()=>{
   image.removeAttribute('src');
   ordered()[active]?.focus({preventScroll:true});
 });
 document.addEventListener('keydown',event=>{
   if(!dialog.open)return;
   if(event.key==='ArrowRight')show(active+1);
   if(event.key==='ArrowLeft')show(active-1);
 });
 dialog.addEventListener('pointerdown',event=>{startX=event.clientX;});
 dialog.addEventListener('pointerup',event=>{
   if(startX===null)return;
   const distance=event.clientX-startX;startX=null;
   if(Math.abs(distance)>50&&event.pointerType!=='mouse'){
     swiped=true;show(active+(distance<0?1:-1));
     setTimeout(()=>{swiped=false;},400);
   }
 });
})();
</script>
</body></html>

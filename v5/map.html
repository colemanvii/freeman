 <header class="bar">
  <nav class="sections" aria-label="Sections"><a href="/company">COMPANY</a><span class="sep" aria-hidden="true">/</span><a href="/map" class="is-current" aria-current="page">PROJECTS</a><span class="sep" aria-hidden="true">/</span><a href="/contact">CONTACT</a></nav>

   <input id="q" type="search" placeholder="Find a project or place" aria-controls="found" aria-expanded="false" aria-autocomplete="list" enterkeyhint="search">
   <ol class="found" id="found" role="listbox" aria-label="Matches" hidden></ol>
  </form>
  <a class="close" id="leave" href="/" aria-label="Close — return to the previous page">× CLOSE</a>
 </header>

 <main class="field" id="field">
  <div class="lede" id="lede">
   <p class="kicker">NORTH GEORGIA</p>
   <h1>Places we’ve built.</h1>
  </div>
  <div class="map" id="map" tabindex="0" aria-label="Map of Freeman projects. Drag or use arrow keys to move, plus and minus to zoom." role="application">

    <div class="scale" id="scale" aria-hidden="true"><i></i><span></span></div>

    <div class="zoom"><button type="button" id="zin" aria-label="Zoom in">+</button><button type="button" id="zout" aria-label="Zoom out">−</button><button type="button" id="zfit" aria-label="Show all places">ALL</button></div>
   </div>
  </div>
  <div class="rule" id="rule" hidden aria-hidden="true"></div>
 </main>

 <aside class="tblock" id="tblock" aria-label="Register"></aside>

<style>
.record-attribution{position:fixed;left:calc(var(--edge) + 2px);bottom:calc(var(--edge) + 3px);z-index:8;background:var(--paper);padding:3px 5px;font:8px/1.4 Monaco,"Courier New",monospace;letter-spacing:.015em;color:var(--muted);text-decoration:none}
.record-attribution:hover,.record-attribution:focus-visible{color:var(--red-text);outline:1px solid var(--red-text)}
@media(max-width:760px){.record-attribution{left:12px;bottom:calc(57px + env(safe-area-inset-bottom));font-family:var(--mono);font-size:9px}
 /* Phones: the attribution belongs to the map (moved into the field below), so it follows the map's lower edge
    and the register covers it rather than the other way round. With a project sheet up it rides just above
    the sheet (--lift, set by record.js with the zoom controls). */
 .field>.record-attribution{position:absolute;left:12px;bottom:7px;z-index:2;transform:translateY(calc(-1 * var(--lift, 0px)))}}
</style>
<script>
(() => {
  const a = document.querySelector('.record-attribution'), field = document.getElementById('field');
  const home = a.nextElementSibling, phone = matchMedia('(max-width:760px)');
  const place = () => {
    if (phone.matches && a.parentElement !== field) field.append(a);
    else if (!phone.matches && a.nextElementSibling !== home) home.before(a);
  };
  place();
  phone.addEventListener('change', place);
  addEventListener('resize', place);
})();
</script>

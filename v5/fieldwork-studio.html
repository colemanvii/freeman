<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Freeman / Fieldwork Studio</title><link rel="stylesheet" href="styles.css"><style>
body{overflow:hidden}.studio{position:absolute;inset:0;background:var(--paper);color:var(--ink);padding:28px 30px 24px;display:flex;flex-direction:column}.bar,.foot{display:flex;align-items:center;justify-content:space-between;font:10px/1.5 var(--mono)}.bar strong{color:var(--orange);font-weight:400}.mast{margin-top:68px;border-bottom:1px solid var(--hair);padding-bottom:20px;display:flex;align-items:end;justify-content:space-between}.mast h1{font-size:35px;letter-spacing:-.06em}.tag{color:var(--orange);font-size:9px}.tools{display:flex;align-items:center;gap:14px;padding:14px 0;font-size:10px}.tools button[aria-pressed=true]{color:var(--orange)}.tools .grow{flex:1}.grid{display:grid;grid-template-columns:repeat(var(--cols,3),minmax(0,1fr));gap:20px 16px;overflow:auto;min-height:0;flex:1;align-content:start}.tile{min-width:0;cursor:grab}.tile img{width:100%;height:clamp(120px,18vh,220px);object-fit:cover;filter:saturate(.82);display:block}.tile button{width:100%;text-align:left}.tile small{font-size:9px;color:var(--muted)}.tile .nm{font-size:11px;margin-top:7px}.tile.over{outline:1px dashed var(--orange)}.foot{padding-top:14px;color:var(--muted)}.detail{position:absolute;inset:0;padding:28px 30px;background:var(--paper);display:none;flex-direction:column}.detail.open{display:flex}.detail-body{flex:1;display:grid;grid-template-columns:minmax(0,1.5fr) minmax(210px,.7fr);gap:6vw;align-items:center;padding:30px 8vw}.detail img{width:100%;max-height:65vh;object-fit:contain}.detail input{font:12px var(--mono);width:100%;background:none;color:var(--ink);border:0;border-bottom:1px solid var(--hair);padding:12px 0}.detail label{display:block;margin-top:20px;color:var(--muted);font-size:9px}.detail h2{font-size:22px;margin-bottom:12px}.file{display:none}@media(max-width:760px){.studio{padding:18px 16px}.mast{margin-top:50px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.tools{flex-wrap:wrap}.detail{padding:18px}.detail-body{display:block;overflow:auto;padding:28px 0}.detail img{max-height:42vh}.tile img{height:140px}}</style></head><body><main class="studio"><header class="bar"><span>FREEMAN GC / <strong>FIELDWORK</strong> / STUDIO</span><a href="fieldwork.html">× LIVE FIELDWORK</a></header><div class="mast"><h1>Fieldwork<span style="color:var(--orange)">.</span></h1><span class="tag">STUDIO / UNPUBLISHED</span></div><div class="tools"><span>COMPOSITION</span><button data-cols="2">02</button><button data-cols="3" aria-pressed="true">03</button><button data-cols="4">04</button><button data-cols="5">05</button><span class="grow"></span><button id="labels">HIDE CAPTIONS</button><button id="shuffle">SHUFFLE ↗</button><button id="upload-btn">+ ADD PHOTO</button><button id="reset">RESET</button></div><section id="grid" class="grid"></section><footer class="foot"><span>FREEMAN GENERAL CONTRACTING / CARTERSVILLE, GEORGIA</span><span>BUILT FOR GENERATIONS™</span></footer><input id="upload" class="file" type="file" accept="image/*" multiple></main><div id="detail" class="detail" role="dialog" aria-modal="true"><header class="bar"><span>FREEMAN GC / FIELDWORK / RECORD</span><button id="close">× CLOSE</button></header><div class="detail-body"><img id="big" alt=""><div><div class="tag" id="type"></div><h2 id="title"></h2><label>TITLE / LOCAL STUDY<input id="edit-title"></label><label>PROJECT / LOCAL STUDY<input id="edit-project"></label><p style="font-size:9px;color:var(--muted);margin-top:25px">Study only. Editing here does not publish or alter Freeman's project archive.</p><div style="display:flex;justify-content:space-between;margin-top:25px"><button id="prev">← PREVIOUS</button><button id="next">NEXT →</button></div></div></div></div><script src="records.js"></script><script>
let entries=window.RECORDS.archive.map((a,i)=>({id:i,title:a.title,project:a.project,type:a.status||a.type,img:"assets/"+a.image})),initial=entries.map(a=>({...a})),chosen=0,drag=-1,showLabels=true;const $=x=>document.querySelector(x),grid=$("#grid");function render(){grid.innerHTML="";entries.forEach((a,i)=>{let t=document.createElement("article");t.className="tile";t.draggable=true;let b=document.createElement("button"),im=document.createElement("img"),name=document.createElement("div"),meta=document.createElement("small");im.src=a.img;im.alt="";name.className="nm";name.textContent=String(i+1).padStart(3,"0")+" / "+a.title;meta.textContent=a.project+" / "+a.type;b.append(im);if(showLabels)b.append(name,meta);b.onclick=()=>open(i);t.append(b);t.ondragstart=()=>{drag=i};t.ondragover=e=>{e.preventDefault();t.classList.add("over")};t.ondragleave=()=>t.classList.remove("over");t.ondrop=e=>{e.preventDefault();t.classList.remove("over");if(drag<0)return;entries.splice(i,0,entries.splice(drag,1)[0]);drag=-1;render()};grid.append(t)})}function open(i){chosen=i;let a=entries[i];$("#big").src=a.img;$("#type").textContent=a.type;$("#title").textContent=a.title;$("#edit-title").value=a.title;$("#edit-project").value=a.project;$("#detail").classList.add("open")}$("#close").onclick=()=>{$("#detail").classList.remove("open");render()};$("#edit-title").oninput=e=>{entries[chosen].title=e.target.value;$("#title").textContent=e.target.value};$("#edit-project").oninput=e=>entries[chosen].project=e.target.value;$("#prev").onclick=()=>open((chosen-1+entries.length)%entries.length);$("#next").onclick=()=>open((chosen+1)%entries.length);$("#labels").onclick=()=>{showLabels=!showLabels;$("#labels").textContent=showLabels?"HIDE CAPTIONS":"SHOW CAPTIONS";render()};$("#shuffle").onclick=()=>{entries.sort(()=>Math.random()-.5);render()};$("#reset").onclick=()=>{entries=initial.map(a=>({...a}));render()};$("#upload-btn").onclick=()=>$("#upload").click();$("#upload").onchange=e=>{[...e.target.files].forEach(f=>{let r=new FileReader();r.onload=()=>{entries.unshift({title:f.name,project:"Your photo",type:"LOCAL / NOT PUBLISHED",img:r.result});render()};r.readAsDataURL(f)})};document.querySelectorAll("[data-cols]").forEach(b=>b.onclick=()=>{grid.style.setProperty("--cols",b.dataset.cols);document.querySelectorAll("[data-cols]").forEach(x=>x.setAttribute("aria-pressed",String(b===x)))});document.onkeydown=e=>{if(e.key==="Escape")$("#close").click()};render();
</script></body></html>

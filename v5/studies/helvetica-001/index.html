<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Helvetica Neue 001</title>
<style>
:root{--paper:#fff9f1;--ink:#332e20;--muted:#706659;--hair:#d5cec3;--orange:#f93822;--sans:"Helvetica Neue",Helvetica,Arial,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font:400 13px/1.4 var(--sans);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
header,section{padding:0 32px}
header{display:flex;justify-content:space-between;align-items:baseline;padding-top:30px;padding-bottom:72px;font:500 11px/1.3 var(--sans);letter-spacing:.06em;text-transform:uppercase}
header span:last-child{color:var(--muted);font-weight:400}
h1{font:500 48px/1.02 var(--sans);letter-spacing:-.03em;margin:0 0 96px;padding:0 32px}
h1 span{color:var(--orange)}
section{margin-bottom:120px}
h2{display:flex;gap:24px;align-items:baseline;margin:0 0 20px;padding-top:12px;border-top:1px solid var(--hair);font:500 11px/1.3 var(--sans);letter-spacing:.06em;text-transform:uppercase}
h2 span{color:var(--muted);font-weight:400}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:32px;margin-bottom:48px}
.pair.phone{grid-template-columns:repeat(2,minmax(0,300px));justify-content:start;gap:64px}
figure{margin:0}
figcaption{font:400 11px/1.3 var(--sans);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
figure.new figcaption{color:var(--ink);font-weight:500}
img{display:block;width:100%;height:auto;border:1px solid var(--hair)}
a{color:inherit}
a:hover{background:var(--orange);color:var(--paper)}
@media(max-width:760px){
  header,section,h1{padding-left:20px;padding-right:20px}
  h1{font-size:34px;margin-bottom:64px}
  .pair,.pair.phone{grid-template-columns:1fr;gap:24px}
  .pair.phone{grid-template-columns:1fr 1fr;gap:16px}
}
</style>
</head>

  <div class="pair phone"><figure><figcaption>Current</figcaption><img src="shots/home-mobile-current.jpg" alt="Current homepage, phone"></figure><figure class="new"><figcaption>Helvetica Neue</figcaption><img src="shots/home-mobile-helvetica.jpg" alt="Helvetica Neue homepage, phone"></figure></div>

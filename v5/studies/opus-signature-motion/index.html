<!doctype html><html lang="en" data-palette="chalk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#fff9f1"><title>Signature Hand — Freeman Study</title><link rel="icon" href="/favicon.svg"><link rel="stylesheet" href="/styles.css"><link rel="stylesheet" href="instrument.css"><script defer src="/pixel-mark.js"></script><script defer src="hand.js"></script><script defer src="instrument.js"></script></head>
<body data-route="entrance"><div id="site"><main id="main">
<div class="v4-home" id="home">
  <h1 class="sr-only">Freeman signature — handwriting studies</h1>
  <div class="v4-home-identity" id="identity">
    <div class="v4-home-mark hs-mark" role="img" aria-label="Freeman signature">
      <canvas id="v4-pixel-mark" class="hs-canvas" width="160" height="61" aria-hidden="true"></canvas>
      <canvas id="hs-reference" class="hs-canvas" width="160" height="61" aria-hidden="true" hidden></canvas>
      <canvas id="hs-trace" aria-hidden="true"></canvas>
    </div>
    <nav class="v4-home-nav" aria-hidden="true"><span>COMPANY</span><span class="sep">/</span><span>PROJECTS</span><span class="sep">/</span><span>CONTACT</span></nav>
  </div>

  <section class="hs-panel" aria-label="Study">
    <p class="hs-title">Signature motion — the hand</p>
    <div class="hs-hands" role="radiogroup" aria-label="Interpretation">
      <button type="button" role="radio" data-hand="practiced"><span class="n">01</span>Practiced</button>
      <button type="button" role="radio" data-hand="considered"><span class="n">02</span>Considered</button>
      <button type="button" role="radio" data-hand="breath"><span class="n">03</span>One breath</button>
      <button type="button" role="radio" data-hand="production"><span class="n">—</span>Production</button>
    </div>
    <p class="hs-note" id="note"></p>
    <div class="hs-meter">
      <canvas id="hs-speed" aria-label="Pen speed over time; drag to inspect a moment"></canvas>
      <div class="hs-read"><span id="clock">0000</span><span id="span"></span></div>
    </div>
    <p class="hs-check" id="check"></p>
  </section>

  <div class="hs-controls" role="group" aria-label="Playback">
    <button type="button" id="replay">Replay</button>
    <button type="button" id="slow" aria-pressed="false">Slow ¼×</button>
    <button type="button" id="trace" aria-pressed="false">Pen</button>
    <button type="button" id="timing" aria-label="Timing profile">Desktop</button>
  </div>

  <div class="legal">FREEMAN GENERAL CONTRACTING<br>CARTERSVILLE, GEORGIA</div>
  <div class="v4-colorways" role="group" aria-label="Light or dark">
    <button type="button" class="v4-way v4-way-chalk" data-way="chalk" aria-label="Light"></button>
    <button type="button" class="v4-way v4-way-umber" data-way="umber" aria-label="Dark"></button>
  </div>
  <div class="mark">BUILT FOR GENERATIONS™</div>
</div>
</main></div></body></html>

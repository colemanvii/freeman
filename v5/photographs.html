<style>

<script>
/* Two viewing modes for the same Drive photographs. Collage is the default;
   scroll uses natural image ratios and zero side gutters on mobile. */
(() => {
  const buttons=[...document.querySelectorAll('[data-gallery-view]')];
  const key='freeman:photographs:mode';
  function setMode(mode,save=false){
    if(mode!=='collage'&&mode!=='scroll')mode='collage';
    document.body.dataset.galleryMode=mode;
    buttons.forEach(button=>button.setAttribute('aria-pressed',String(button.dataset.galleryView===mode)));
    if(save){try{localStorage.setItem(key,mode)}catch(e){}}
  }
  let saved='collage';
  try{saved=localStorage.getItem(key)||'collage'}catch(e){}
  setMode(saved);
  buttons.forEach(button=>button.addEventListener('click',()=>setMode(button.dataset.galleryView,true)));
})();
/* Mobile: curated pairings form an actual contact sheet, not a stack of 22 full-width photographs.
   Desktop rows remain unchanged; additional Google Drive photos stay at the end. */
(() => {
 const main=document.querySelector('main'), bp=matchMedia('(max-width:700px)');
 const tiles=[...main.querySelectorAll('.tile')];
 const byId=new Map(tiles.map(t=>[t.dataset.photoId,t]));
 const desktopRows=[...main.querySelectorAll('.photo-row')].map(row=>[...row.querySelectorAll('.tile')].map(t=>t.dataset.photoId));
 const mobileRows=[["1GebdZcFOMI2DGXt1AQgw5HLHhxX7w0_D","1TlLcPA9LQ2V1qLVHPeRf1TR-4Oh31kXB"],["1qq0JogiannwNiCYceJGeSpdwxD39fJ1L","1XoNJTPz2GAZiBfnujEWcmVQBTcXZZQjo"],["1Vl-ZtJkYfjY24wkntmMem0E2PHAG_U0g","1dfAjy7cs1-Yo7BzM26cxrnRY0tlFYUVa"],["1dc_6vXKpH13kH7s8PTOlEZR1t2SZpUUx","1qOnlA7KILjW3OF6PrJJP1VZWB0hr9-y7"],["1ZSheOon_z0A9cBlDnXmIF_Gz3sE25KCa"],["1OTTOWi5VYJoF2b0z3AaYYK1QSbsXv4_3","1_zAbtVB7zLlq4xL5oSYTYhWNvsrO7xYh"],["145sOwV-roo5lKx9l0dKOQ593onc49jcC","1TqiSJqAa60a_Blk8oFh_5e1uczs4DdYG"],["1kc9_t8yG9b0u6B5TB2J2rIMa5YY_jsBs","1wqofDj4b73fKx4uCpoqtNQyhfCoIZju9"],["1BRuJXWyjJv9cvOLHrrnG2bGPZWryVPX3","1xJ6HuO4gZkAtCLmqLhaT9bSqrL0LmME3"],["1RNb3_2UW0ULwTjNdv-OFbd1cADXGyUhl","16Ki2nyYdEgC8H8I_hpw8nU7hgctlEYUX"],["1vOeVkar9-96DU3F5iH5DHc2WSKWDJ7NP","12Np6uey0czlQRKBsvTrBOhhZ5aFo_9yD"],["1Q_9BF5kl0M3oCSRqtoy72YhmEn3T800X"]];
 function arrange() {
  const used=new Set(), frag=document.createDocumentFragment();
  const appendRow=ids=>{
   const row=document.createElement('div');row.className='photo-row';
   for(const id of ids){const tile=byId.get(id);if(tile&&!used.has(id)){row.appendChild(tile);used.add(id);}}
   if(row.childElementCount)frag.appendChild(row);
  };
  for(const row of (bp.matches?mobileRows:desktopRows))appendRow(row);
  const incoming=tiles.filter(t=>!used.has(t.dataset.photoId));
  for(let i=0;i<incoming.length;i+=2)appendRow(incoming.slice(i,i+2).map(t=>t.dataset.photoId));
  main.replaceChildren(frag);
  document.dispatchEvent(new Event('freeman:photographs-reordered'));
 }
 bp.addEventListener('change',arrange);
 arrange();
})();
(()=>{let tiles=[...document.querySelectorAll('.tile')];const d=document.querySelector('dialog'),img=d.querySelector('.stage img');document.addEventListener('freeman:photographs-reordered',()=>{tiles=[...document.querySelectorAll('.tile')];if(d.open)d.close();});let i=0,x0=null,swiped=false;
const show=n=>{i=(n+tiles.length)%tiles.length;img.src=tiles[i].href;[i+1,i-1].forEach(k=>{const t=tiles[(k+tiles.length)%tiles.length];new Image().src=t.href;});};
tiles.forEach(t=>t.addEventListener('click',e=>{if(e.metaKey||e.ctrlKey||e.shiftKey)return;e.preventDefault();show(tiles.indexOf(t));d.showModal();}));
d.querySelector('.prev').onclick=()=>{if(!swiped)show(i-1);};d.querySelector('.next').onclick=()=>{if(!swiped)show(i+1);};
d.querySelector('[data-close]').onclick=()=>d.close();img.onclick=()=>{if(swiped){swiped=false;return;}d.close();};
d.addEventListener('close',()=>{img.removeAttribute('src');tiles[i].focus({preventScroll:false});});
document.addEventListener('keydown',e=>{if(!d.open)return;if(e.key==='ArrowRight')show(i+1);else if(e.key==='ArrowLeft')show(i-1);});
d.addEventListener('pointerdown',e=>{x0=e.clientX;});d.addEventListener('pointerup',e=>{if(x0===null)return;const dx=e.clientX-x0;x0=null;if(Math.abs(dx)>50&&e.pointerType!=='mouse'){swiped=true;setTimeout(()=>swiped=false,400);show(dx<0?i+1:i-1);}});
})();
</script>

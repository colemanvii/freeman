<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow,noarchive"><meta name="referrer" content="same-origin"><meta name="theme-color" content="#fff9f1"><title>Photographs — Freeman GC</title><link rel="icon" href="/favicon.svg"><script src="/palette.js?v=20261026-monaco-restored"></script><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Franklin:ital,wght@0,300..700;1,300..700&display=block">
<style>
:root{--paper:#fff9f1;--ink:#332e20;--muted:#706659;--hair:#d5cec3;--orange:#f93822;--mono:"Libre Franklin","Franklin Gothic Book","Franklin Gothic",Arial,sans-serif;--edge:clamp(18px,2.4vw,30px);--gap:clamp(6px,.7vw,10px);--row:clamp(190px,30vw,420px)}
:root[data-palette="sand"]{--paper:#ddcfb3;--ink:#332e20;--muted:#6d6150;--hair:#b5a68c}
:root[data-palette="umber"]{--paper:#332e20;--ink:#fff9f1;--muted:#c5b9a7;--hair:#71685c}
*{box-sizing:border-box}html{background:var(--paper)}body{margin:0;background:var(--paper);color:var(--ink);font:10px/1.5 var(--mono);letter-spacing:.035em;text-transform:uppercase;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}a:focus-visible,button:focus-visible{outline:1px solid var(--orange);outline-offset:4px}
header{padding:28px var(--edge) 0;height:94px}header a{font-weight:700}header a:hover{background:var(--orange);color:var(--paper)}
main{padding:0 var(--edge) calc(var(--edge)*2);display:flex;flex-wrap:wrap;gap:var(--gap)}
main::after{content:"";flex:999 1 0}
.tile{flex:var(--r) 1 calc(var(--r)*var(--row));display:block;cursor:zoom-in}
.tile{overflow:hidden}.tile img{display:block;width:100%;height:100%;object-fit:cover}
@media(max-width:700px){header{height:70px;padding-top:20px}main{display:block}.tile{margin-bottom:var(--gap)}}
dialog{position:fixed;inset:0;width:100%;height:100%;max-width:none;max-height:none;margin:0;padding:0;border:0;background:var(--paper);color:var(--ink)}
dialog::backdrop{background:var(--paper)}
dialog[open]{display:grid;grid-template-rows:94px minmax(0,1fr) 94px}
.bar{display:flex;justify-content:flex-end;align-items:flex-start;padding:28px var(--edge) 0}
.bar button{font:inherit;letter-spacing:inherit;text-transform:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}.bar button:hover{background:var(--orange);color:var(--paper)}
.stage{position:relative;min-height:0;padding:0 var(--edge)}
.stage img{width:100%;height:100%;object-fit:contain;display:block;user-select:none;-webkit-user-drag:none}
.zone{position:absolute;top:0;bottom:0;width:34%;border:0;background:none;padding:0}.zone.prev{left:0;cursor:w-resize}.zone.next{right:0;cursor:e-resize}
@media(max-width:700px){dialog[open]{grid-template-rows:70px minmax(0,1fr) 70px}.bar{padding-top:20px}}
</style></head><body>
<header><a href="/">FREEMAN GC</a></header>
<main>
<!-- Photographs are inserted from Google Drive by lib/photographs-drive.js. -->
</main>
<dialog aria-label="Photograph"><div class="bar"><button type="button" data-close>Close</button></div><div class="stage"><img alt=""><button class="zone prev" type="button" aria-label="Previous"></button><button class="zone next" type="button" aria-label="Next"></button></div></dialog>
<script>
(()=>{const main=document.querySelector('main'),tiles=[...main.querySelectorAll('.tile')],r=tiles.map(t=>t.dataset.w/t.dataset.h);
function layout(){const cs=getComputedStyle(main),W=main.clientWidth-parseFloat(cs.paddingLeft)-parseFloat(cs.paddingRight),gap=parseFloat(cs.columnGap)||0;
 if(innerWidth<=700){tiles.forEach(t=>t.style.cssText='--r:'+t.style.getPropertyValue('--r'));return;}
 const H=Math.min(420,Math.max(190,innerWidth*.3)),S=r.reduce((a,b)=>a+b,0),n=r.length,k=Math.max(1,Math.min(n,Math.round(S*H/W))),T=S/k;
 const pre=[0];r.forEach(x=>pre.push(pre[pre.length-1]+x));const cost=(a,b)=>(pre[b]-pre[a]-T)**2;
 const D=[...Array(k+1)].map(()=>Array(n+1).fill(Infinity)),B=[...Array(k+1)].map(()=>Array(n+1).fill(0));D[0][0]=0;
 for(let j=1;j<=k;j++)for(let b=j;b<=n;b++)for(let a=j-1;a<b;a++){const v=D[j-1][a]+cost(a,b);if(v<D[j][b]){D[j][b]=v;B[j][b]=a;}}
 const cuts=[];for(let j=k,b=n;j>0;j--){const a=B[j][b];cuts.unshift([a,b]);b=a;}
 for(const [a,b] of cuts){const sum=pre[b]-pre[a],h=(W-gap*(b-a-1))/sum;let used=0;
  for(let i=a;i<b;i++){const w=i===b-1?W-gap*(b-a-1)-used:Math.floor(r[i]*h);used+=w;tiles[i].style.flex='0 0 '+w+'px';tiles[i].style.height=Math.round(h)+'px';}}}
let raf;addEventListener('resize',()=>{cancelAnimationFrame(raf);raf=requestAnimationFrame(layout);});layout();})();
(()=>{const tiles=[...document.querySelectorAll('.tile')],d=document.querySelector('dialog'),img=d.querySelector('.stage img');let i=0,x0=null,swiped=false;
const show=n=>{i=(n+tiles.length)%tiles.length;img.src=tiles[i].href;[i+1,i-1].forEach(k=>{const t=tiles[(k+tiles.length)%tiles.length];new Image().src=t.href;});};
tiles.forEach((t,n)=>t.addEventListener('click',e=>{if(e.metaKey||e.ctrlKey||e.shiftKey)return;e.preventDefault();show(n);d.showModal();}));
d.querySelector('.prev').onclick=()=>{if(!swiped)show(i-1);};d.querySelector('.next').onclick=()=>{if(!swiped)show(i+1);};
d.querySelector('[data-close]').onclick=()=>d.close();img.onclick=()=>{if(swiped){swiped=false;return;}d.close();};
d.addEventListener('close',()=>{img.removeAttribute('src');tiles[i].focus({preventScroll:false});});
document.addEventListener('keydown',e=>{if(!d.open)return;if(e.key==='ArrowRight')show(i+1);else if(e.key==='ArrowLeft')show(i-1);});
d.addEventListener('pointerdown',e=>{x0=e.clientX;});d.addEventListener('pointerup',e=>{if(x0===null)return;const dx=e.clientX-x0;x0=null;if(Math.abs(dx)>50&&e.pointerType!=='mouse'){swiped=true;setTimeout(()=>swiped=false,400);show(dx<0?i+1:i-1);}});
})();
</script>
</body></html>

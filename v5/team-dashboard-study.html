<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#f4f4f0"><title>Freeman OS / Operations</title><link rel="icon" href="favicon.svg">
<script src="/palette.js"></script>
<style>
:root{--paper:#f4f4f0;--ink:#30312f;--muted:#6c6e69;--rule:#cfd1cb;--orange:#f05a28;--orange-text:#c2431a}
:root[data-palette="sand"]{--paper:#d9c5a7;--ink:#302820;--muted:#766757;--rule:#b8a388;--orange:#ba4e2d;--orange-text:#a44023}
:root[data-palette="umber"]{--paper:#51453b;--ink:#f5eddf;--muted:#c9bcae;--rule:#817063;--orange:#ec7950;--orange-text:#ec7950}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--paper);color:var(--ink)}body{font:12px/1.6 Monaco,"SFMono-Regular",Consolas,monospace;-webkit-font-smoothing:antialiased}button,a{font:inherit;color:inherit;cursor:pointer}button{background:none;border:0;text-align:left;padding:0}a{text-decoration:none}button:hover,a:hover{color:var(--orange-text)}button:focus-visible,a:focus-visible,input:focus-visible{outline:1px solid var(--orange);outline-offset:4px}.frame{height:100dvh;padding:32px 40px;display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:20px}.top,.footer{display:flex;justify-content:space-between;align-items:center;gap:20px}.top{font-size:11px}.muted,.footer,.eyebrow{color:var(--muted)}.footer{border-top:1px solid var(--rule);padding-top:15px;font-size:10px}.stage{display:grid;grid-template-columns:1.1fr 1fr;gap:clamp(45px,8vw,150px);align-items:center;min-height:0}.left,.right{min-width:0}.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.01em}.left h1{font-size:clamp(44px,5.8vw,90px);font-weight:400;letter-spacing:-.075em;line-height:1.1;margin:28px 0 30px;max-width:700px;overflow-wrap:anywhere}.left h1:focus{outline:none}.left p{font-size:15px;line-height:1.8;max-width:510px}.right{max-width:570px}.right .eyebrow{margin-bottom:30px}.choice{width:100%;display:grid;grid-template-columns:42px 1fr 16px;gap:9px;align-items:center;padding:16px 0}.choice .number{color:var(--orange-text);font-size:11px}.choice .name{font-size:clamp(15px,1.45vw,20px)}.choice .desc{font-size:11px;color:var(--muted);display:block;margin-top:3px;max-width:39ch}.step{display:grid;grid-template-columns:38px 1fr;gap:12px;padding:12px 0}.number{color:var(--orange-text)}.step strong{font-weight:400;font-size:14px}.step small{display:block;color:var(--muted);font-size:11px;line-height:1.7;margin-top:6px}.step a{text-decoration:underline;text-underline-offset:4px;display:inline-block;padding:6px 0;margin:-6px 0}.actions{display:flex;justify-content:space-between;gap:16px;margin-top:26px;font-size:11px}.actions button{min-height:44px;margin:-13px 0;padding:0}#next{color:var(--orange-text);margin-left:auto}.note{margin-top:24px;font-size:10px;color:var(--muted);line-height:1.7;max-width:55ch}.hidden{display:none!important}.close{white-space:nowrap;display:inline-flex;align-items:center;min-height:44px;min-width:44px;margin:-15px 0}body[data-view=step] .left h1{font-size:clamp(40px,5vw,75px)}
.list,.steps{list-style:none;margin:0;padding:0;width:100%}.list li,.steps li{border-top:1px solid var(--rule)}.list li:last-child,.steps li:last-child{border-bottom:1px solid var(--rule)}
.stage{grid-template-rows:minmax(0,1fr)}.right{display:flex;flex-direction:column;max-height:100%}#body{min-height:0;overflow:auto}.choice{min-height:44px}.actions button{min-width:44px}#back{text-align:left}#next{text-align:right}
.code-form{margin-top:18px;border-top:1px solid var(--rule);padding-top:15px}.code-form label{font-size:10px;color:var(--muted)}.code-line{margin-top:5px;border-bottom:1px solid var(--rule);display:flex;align-items:center}.code-line:focus-within{border-bottom-color:var(--orange)}.code-line input{min-width:0;flex:1;border:0;background:transparent;padding:9px 0;outline:none;font:14px Monaco,Consolas,monospace;color:var(--ink)}.code-line button{min-width:44px;min-height:44px;font-size:18px;text-align:center}#code-status{display:block;color:var(--orange-text);font-size:10px;min-height:12px}
h2.eyebrow{font-weight:400;margin-top:0}.relationship-heading{display:flex;align-items:baseline;justify-content:space-between;gap:10px}.team-entry{font-size:10px;letter-spacing:.01em;color:var(--muted);white-space:nowrap}.team-entry:hover,.team-entry:focus-visible{color:var(--orange-text)}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
@media(max-width:760px){.frame{padding:20px 20px 18px;gap:12px}.stage{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr);gap:12px;align-items:start}.left{border-bottom:1px solid var(--rule);padding-bottom:12px}.left h1{font-size:clamp(38px,11vw,55px);margin:10px 0}.left p{font-size:11px;line-height:1.55;margin:0}.right{align-self:stretch;min-height:0;max-width:none}.right .eyebrow{margin:0 0 12px}.choice{padding:11px 0}.choice .name{font-size:14px}.choice .desc{font-size:10px}.step{padding:8px 0}.step strong{font-size:12px}.step small{font-size:10px;margin-top:2px}.actions{margin-top:14px}.note{font-size:10px;margin-top:12px}.code-form{margin-top:10px;padding-top:8px}.code-line input{font-size:12px;padding:6px 0}.footer{font-size:9px;padding-top:9px}body[data-view=step] .left h1{font-size:clamp(28px,9.5vw,50px)}}
@media(max-width:760px) and (max-height:760px){body[data-view=overview] .choice .desc{display:none}body[data-view=overview] .choice{padding:10px 0}}
@media(max-width:760px) and (max-height:600px){.left h1{font-size:clamp(32px,10vw,44px);margin:6px 0}.note{margin-top:8px}}
@media(min-width:761px) and (max-height:820px){.choice{padding:9px 0}.choice .desc{max-width:none;line-height:1.5}.right .eyebrow{margin-bottom:18px}.actions{margin-top:18px}.note{margin-top:16px}.left h1{margin:18px 0 20px}}
@media(max-height:500px) and (orientation:landscape){.frame{padding:12px 24px 10px;gap:8px}.stage{grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);grid-template-rows:minmax(0,1fr);gap:28px;align-items:center}.left{border:0;padding:0}.left h1,body[data-view=step] .left h1{font-size:clamp(26px,5vw,40px);margin:6px 0 8px}.left p{font-size:11px;line-height:1.5;margin:0}.right{align-self:stretch;justify-content:center;max-width:none}.right .eyebrow{margin:0 0 6px}.choice,body[data-view=overview] .choice{padding:0}.choice .desc{display:none}.choice .name{font-size:13px}.step{padding:5px 0}.step strong{font-size:12px}.step small{font-size:10px;margin-top:2px;line-height:1.5}.actions{margin-top:6px}.note{margin-top:4px;font-size:10px;line-height:1.5}.code-form{margin-top:6px;padding-top:4px}.code-line input{padding:4px 0;font-size:12px}#code-status{min-height:0}.footer{padding-top:6px;font-size:9px}}
body[data-view=home] .left h1{font-size:clamp(28px,3.8vw,60px);color:var(--orange)}

/* Freeman identity is shared across entrance and ACCESS; no separate portal skin. */
:root{--mono:Monaco,"SFMono-Regular",Consolas,"Liberation Mono",monospace;--muted:#6c6e69;--rule:#cfd1cb}
html,body{font-family:var(--mono);-webkit-font-smoothing:none;text-rendering:geometricPrecision}
body{font:12px/1.7 var(--mono)}
button,a{font-family:inherit}
button:hover,a:hover{color:var(--ink)}
.choice:hover .name,.choice:focus-visible .name,.close:hover,#next:hover{background:var(--orange);color:var(--paper)}
.top{font-size:10px;letter-spacing:.035em;text-transform:uppercase}
.top>span:first-child{font-weight:700}
.eyebrow{font-size:10px;letter-spacing:.035em}
.left h1{font-size:clamp(38px,5.4vw,76px);font-weight:400;letter-spacing:-.055em;line-height:1.15}
.left p{font-size:13px;line-height:1.7}
.choice{border-radius:0;min-height:56px}
.choice .name{font-size:clamp(14px,1.25vw,17px);line-height:1.5}
.choice .desc{font-size:11px}
.footer{font-size:9px;letter-spacing:.04em;text-transform:uppercase}
:root[data-palette="sand"]{--muted:#766757}
:root[data-palette="umber"]{--muted:#c9bcae}
@media(max-width:760px){
 .frame{padding:20px 20px 18px}
 .left h1{font-size:clamp(36px,10vw,52px);letter-spacing:-.055em}
 .left p{font-size:12px}
 .choice{min-height:48px}
 .choice .name{font-size:14px}
 .footer{font-size:9px}
}
</style><link rel="stylesheet" href="/portal-identity.css"><style>
/* Operational extension of the approved ACCESS composition. */
body[data-view=home] .left h1{font-size:clamp(38px,5.4vw,76px);color:var(--orange)}
.choice{border-bottom:1px solid var(--rule);border-top:0}
.choice:first-child{border-top:1px solid var(--rule)}
.choice .name{font-size:clamp(14px,1.25vw,17px)}
.choice .desc{max-width:48ch}
.right{max-width:610px}
.state{font-size:10px;color:var(--muted);text-align:right;white-space:nowrap}
.choice[data-urgent=true] .state{color:var(--orange-text)}
.stage{grid-template-columns:1.1fr 1fr}
.note{margin-top:28px}
@media(max-width:760px){.state{font-size:9px}.choice{grid-template-columns:32px 1fr auto;gap:6px}.stage{grid-template-columns:1fr}.left h1{font-size:clamp(38px,10vw,52px)}}
</style></head>
<body data-view="home"><main class="frame">
<header class="top"><span>FREEMAN GC</span><span class="muted">FREEMAN OS / <a class="close" href="/client-access.html" aria-label="Back to Freeman Access">× CLOSE</a></span></header>
<section class="stage">
<div class="left"><div class="eyebrow" id="kicker">FREEMAN / OPERATIONS</div><h1 id="heading">Today.</h1><p id="intro">Everything that needs our attention. One company, one working record.</p></div>
<div class="right"><h2 class="eyebrow" id="section">YOUR OPERATIONS</h2><div id="body"></div><div class="actions"><button type="button" id="back" class="hidden">← BACK</button><button type="button" id="next" class="hidden">RETURN TO OVERVIEW ↗</button></div><p class="note" id="note">FICTIONAL DEMONSTRATION / NO LIVE PROJECT CONNECTIONS.</p></div>
</section>
<footer class="footer"><span>BUILT FOR GENERATIONS</span><span>FREEMAN GENERAL CONTRACTING / PRIVATE</span></footer></main>
<script type="module">
import {projectView} from './system/project-record.js';
import {SAMPLE_PROJECT} from './system/sample-project.js';
const project=projectView(SAMPLE_PROJECT,'team');
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const screens={
 overview:{heading:'Today.',kicker:'FREEMAN / OPERATIONS',intro:'Everything that needs our attention. One company, one working record.',section:'YOUR OPERATIONS',note:'SELECT AN AREA TO REVIEW. ALL DATA IS FICTIONAL.',rows:[
  ['PROJECTS','Current project records and phases',''+1,'projects'],
  ['DECISIONS','Questions waiting for a response',String(project.decisions.length).padStart(2,'0'),'decisions'],
  ['COMMITMENTS','Responsibilities and next actions',String(project.commitments.length).padStart(2,'0'),'commitments'],
  ['FIELDWORK','Recent field documentation',String(project.fieldUpdates.length).padStart(2,'0'),'field']
 ]},
 projects:{heading:'Projects.',kicker:'FREEMAN / PROJECT RECORD',intro:'The result proves taste. The evidence proves capability.',section:'PROJECTS / CURRENT',rows:[[project.name,project.phase+' / '+project.status,'01','project']],note:'ONE SAMPLE RECORD / DEMONSTRATION ONLY.'},
 project:{heading:'Alder.',kicker:'PROJECT / 001',intro:'One shared record, organized around who needs to act.',section:'PROJECT CONTENT',rows:[
 ['MILESTONES',project.milestones.length+' scheduled',String(project.milestones.length).padStart(2,'0'),'milestones'],
 ['DECISIONS',project.decisions.length+' items',String(project.decisions.length).padStart(2,'0'),'decisions'],
 ['DOCUMENTS',project.documents.length+' records',String(project.documents.length).padStart(2,'0'),'documents'],
 ['PROPOSAL','Study 05 / draft',String(project.proposals.length).padStart(2,'0'),'proposals']
 ],note:'DEMO / NO CONFIDENTIAL INFORMATION.'}
};
for(const [id,items,heading] of [['decisions',project.decisions,'Decisions.'],['commitments',project.commitments,'Commitments.'],['field',project.fieldUpdates,'Fieldwork.'],['milestones',project.milestones,'Milestones.'],['documents',project.documents,'Documents.'],['proposals',project.proposals,'Proposal.']]){
 screens[id]={heading,kicker:'ALDER / DEMONSTRATION',intro:'One project record. Every responsibility traceable.',section:id.toUpperCase(),note:'DEMONSTRATION DATA / NOTHING SAVED OR SENT.',rows:items.map((x,i)=>[x.title,x.status||x.state||x.createdAt||x.date||x.owner||x.version||'PROJECT RECORD',String(i+1).padStart(2,'0'),null])};
}
let current='overview';
function render(id){current=screens[id]?id:'overview';const s=screens[current];document.body.dataset.view=current==='overview'?'home':'step';$('heading').textContent=s.heading;$('kicker').textContent=s.kicker;$('intro').textContent=s.intro;$('section').textContent=s.section;$('note').textContent=s.note;$('body').innerHTML='<div class="list">'+s.rows.map(([title,desc,num,target])=>'<button type="button" class="choice" '+(target?'data-target="'+esc(target)+'"':'disabled')+'><span class="number">'+esc(num)+'</span><span><span class="name">'+esc(title)+'</span><span class="desc">'+esc(desc)+'</span></span><span class="state">'+(target?'↗':'—')+'</span></button>').join('')+'</div>';$('back').classList.toggle('hidden',current==='overview');$('next').classList.toggle('hidden',current==='overview');}
$('body').addEventListener('click',e=>{const target=e.target.closest('[data-target]');if(target)render(target.dataset.target)});
$('back').addEventListener('click',()=>render(current==='project'?'projects':'overview'));
$('next').addEventListener('click',()=>render('overview'));
render('overview');
</script></body></html>

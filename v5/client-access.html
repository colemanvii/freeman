*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--paper);color:var(--ink)}body{font:12px/1.6 Monaco,"SFMono-Regular",Consolas,monospace;-webkit-font-smoothing:antialiased}button,a{font:inherit;color:inherit;cursor:pointer}button{background:none;border:0;text-align:left;padding:0}a{text-decoration:none}button:hover,a:hover{color:var(--orange-text)}button:focus-visible,a:focus-visible,input:focus-visible{outline:1px solid var(--orange);outline-offset:4px}.frame{height:100dvh;padding:32px 40px;display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:20px}.top,.footer{display:flex;justify-content:space-between;align-items:center;gap:20px}.top{font-size:11px}.muted,.footer,.eyebrow{color:var(--muted)}.footer{border-top:1px solid var(--rule);padding-top:15px;font-size:10px}.stage{display:grid;grid-template-columns:1.1fr 1fr;gap:clamp(45px,8vw,150px);align-items:center;min-height:0}.left,.right{min-width:0}.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.01em}.left h1{font-size:clamp(44px,5.8vw,90px);font-weight:400;letter-spacing:-.075em;line-height:1.1;margin:28px 0 30px;max-width:700px;overflow-wrap:anywhere}.left h1:focus{outline:none}.left p{font-size:15px;line-height:1.8;max-width:510px}.right{max-width:570px}.right .eyebrow{margin-bottom:30px}.choice{width:100%;display:grid;grid-template-columns:42px 1fr 16px;gap:9px;align-items:center;padding:16px 0}.choice .number{color:var(--orange-text);font-size:11px}.choice .name{font-size:clamp(15px,1.45vw,20px)}.choice .desc{font-size:11px;color:var(--muted);display:block;margin-top:3px;max-width:39ch}.step{display:grid;grid-template-columns:38px 1fr;gap:12px;padding:12px 0}.number{color:var(--orange-text)}.step strong{font-weight:400;font-size:14px}.step small{display:block;color:var(--muted);font-size:11px;line-height:1.7;margin-top:6px}.step a{text-decoration:underline;text-underline-offset:4px;display:inline-block;padding:6px 0;margin:-6px 0}.actions{display:flex;justify-content:space-between;gap:16px;margin-top:26px;font-size:11px}.actions button{min-height:44px;margin:-13px 0;padding:0}#next{color:var(--orange-text);margin-left:auto}.note{margin-top:24px;font-size:10px;color:var(--muted);line-height:1.7;max-width:55ch}.hidden{display:none!important}.close{white-space:nowrap;display:inline-flex;align-items:center;min-height:44px;min-width:44px;margin:-15px 0}body[data-view=step] .left h1{font-size:clamp(40px,5vw,75px)}
.list,.steps{list-style:none;margin:0;padding:0;width:100%}.list li,.steps li{border-top:1px solid var(--rule)}.list li:last-child,.steps li:last-child{border-bottom:1px solid var(--rule)}
.stage{grid-template-rows:minmax(0,1fr)}.right{display:flex;flex-direction:column;max-height:100%}#body{min-height:0;overflow:auto}.choice{min-height:44px}.actions button{min-width:44px}#back{text-align:left}#next{text-align:right}
.code-form{margin-top:18px;border-top:1px solid var(--rule);padding-top:15px}.code-form label{font-size:10px;color:var(--muted)}.code-line{margin-top:5px;border-bottom:1px solid var(--rule);display:flex;align-items:center}.code-line:focus-within{border-bottom-color:var(--orange)}.code-line input{min-width:0;flex:1;border:0;background:transparent;padding:9px 0;outline:none;font:14px Monaco,Consolas,monospace;color:var(--ink)}.code-line button{min-width:44px;min-height:44px;font-size:18px;text-align:center}#code-status{display:block;color:var(--orange-text);font-size:10px;min-height:12px}
h2.eyebrow{font-weight:400;margin-top:0}.relationship-heading{display:flex;align-items:baseline;justify-content:space-between;gap:10px}.team-entry{font-size:10px;letter-spacing:.01em;color:var(--muted);white-space:nowrap}.team-entry:hover,.team-entry:focus-visible{color:var(--orange-text)}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}

@media(max-width:760px) and (max-height:760px){body[data-view=overview] .choice .desc{display:none}body[data-view=overview] .choice{padding:10px 0}}
@media(max-width:760px) and (max-height:600px){.left h1{font-size:clamp(32px,10vw,44px);margin:6px 0}.note{margin-top:8px}}
@media(min-width:761px) and (max-height:820px){.choice{padding:9px 0}.choice .desc{max-width:none;line-height:1.5}.right .eyebrow{margin-bottom:18px}.actions{margin-top:18px}.note{margin-top:16px}.left h1{margin:18px 0 20px}}
@media(max-height:500px) and (orientation:landscape){.frame{padding:12px 24px 10px;gap:8px}.stage{grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);grid-template-rows:minmax(0,1fr);gap:28px;align-items:center}.left{border:0;padding:0}.left h1,body[data-view=step] .left h1{font-size:clamp(26px,5vw,40px);margin:6px 0 8px}.left p{font-size:11px;line-height:1.5;margin:0}.right{align-self:stretch;justify-content:center;max-width:none}.right .eyebrow{margin:0 0 6px}.choice,body[data-view=overview] .choice{padding:0}.choice .desc{display:none}.choice .name{font-size:13px}.step{padding:5px 0}.step strong{font-size:12px}.step small{font-size:10px;margin-top:2px;line-height:1.5}.actions{margin-top:6px}.note{margin-top:4px;font-size:10px;line-height:1.5}.code-form{margin-top:6px;padding-top:4px}.code-line input{padding:4px 0;font-size:12px}#code-status{min-height:0}.footer{padding-top:6px;font-size:9px}}
body[data-view=home] .left h1{font-size:clamp(28px,3.8vw,60px);color:var(--orange)}

/* Freeman identity is shared across entrance and ACCESS; no separate portal skin. */
:root{--mono:Monaco,"SFMono-Regular",Consolas,"Liberation Mono",monospace;--muted:#6c6e69;--rule:#cfd1cb}
html,body{font-family:var(--mono);-webkit-font-smoothing:none;text-rendering:geometricPrecision}
body{font:12px/1.7 var(--mono)}
button,a{font-family:inherit}
button:hover,a:hover{color:var(--ink)}
.choice:hover .name,.choice:focus-visible .name,.close:hover,#next:hover{background:var(--orange);color:var(--paper)}
.top{font-size:10px;letter-spacing:.035em;text-transform:uppercase}
.top>span:first-child{font-weight:700}
.eyebrow{font-size:10px;letter-spacing:.035em}
.left h1{font-size:clamp(38px,5.4vw,76px);font-weight:400;letter-spacing:-.055em;line-height:1.15}
.left p{font-size:13px;line-height:1.7}
.choice{border-radius:0;min-height:56px}
.choice .name{font-size:clamp(14px,1.25vw,17px);line-height:1.5}
.choice .desc{font-size:11px}

:root[data-palette="sand"]{--muted:#766757}

@media(max-width:760px){
 .frame{padding:20px 20px 18px}

</style><link rel="stylesheet" href="/portal-identity.css"></head><body data-view="home"><main class="frame"><header class="top"><span>FREEMAN GC</span><span class="muted">ACCESS / <a class="close" id="close" href="/" aria-label="Close Access and return to the previous page">× CLOSE</a></span></header><section class="stage"><div class="left"><div class="eyebrow" id="kicker">FREEMAN / ACCESS</div><h1 id="heading" tabindex="-1">Welcome.</h1><p id="intro">One place to begin working together.</p></div><div class="right"><h2 class="eyebrow" id="section">YOUR RELATIONSHIP</h2><div id="body"></div><div class="actions"><button type="button" id="back" class="hidden">← BACK</button><button type="button" id="next" class="hidden">NEXT STEP ↗</button></div><p class="note" id="note">SELECT A RELATIONSHIP TO CONTINUE.</p></div></section><footer class="footer"><span>BUILT FOR GENERATIONS</span><span>FREEMAN GENERAL CONTRACTING / PRIVATE</span></footer></main><p id="announce" class="sr-only" aria-live="polite" aria-atomic="true"></p>
<script>
(() => {
  'use strict';
  const $ = (id) => document.getElementById(id);
  const esc = (t) => String(t).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const pad = (n) => String(n).padStart(2, '0');
  const COUNT = ['', 'ONE', 'TWO', 'THREE', 'FOUR', 'FIVE', 'SIX', 'SEVEN'];

  // The pathway definition is the single source for every label, count and route on this page.
  const PATHWAYS = {
    client: {
      name: 'CLIENT',
      summary: 'Project introduction, Procore, and kickoff.',
      steps: [
        { title: 'PROJECT INTRODUCTION', text: 'Your Freeman contacts, proposal and project information.' },
        { title: 'PROCORE', platform: 'procore', text: 'Accept your invitation and learn where to find project information, RFIs, submittals and items requiring your review.' },
        { title: 'WORKING WITH FREEMAN', text: 'Communication, decisions and what to expect during construction.' },
        { title: 'KICKOFF', text: 'Coordinate the first project meeting with your Freeman team.' }
      ]
    },
    architect: {
      name: 'ARCHITECT',
      summary: 'Introductions, Procore, and project coordination.',
      steps: [
        { title: 'INTRODUCTIONS', text: 'Your Freeman contacts and the project team.' },
        { title: 'PROCORE', platform: 'procore', text: 'How to access the project, locate project information, review RFIs and respond to submittals.' },
        { title: 'PROJECT COORDINATION', text: 'Project procedures, communication and the first coordination meeting.' }
      ]
    },
    trade: {
      name: 'TRADE PARTNERS',
      summary: 'Prequalification, BuildingConnected, Procore, billing, and preconstruction.',
      steps: [
        { title: 'PREQUALIFICATION', text: 'Complete requested company information and qualification documents.' },
        { title: 'BUILDINGCONNECTED', platform: 'buildingconnected', text: 'Access invitations and required preconstruction information.' },
        { title: 'PROCORE', platform: 'procore', text: 'Accept your invitation, review project information and locate relevant documents.' },
        { title: 'BILLING & PAYMENT', text: 'Understand billing procedures, required documentation and payment terms confirmed by Freeman.' },
        { title: 'PRECONSTRUCTION', text: 'Confirm scope, site requirements and mobilization with your Freeman contact.' }
      ]
    }
  };
  const PLATFORMS = {
    procore: { label: 'PROCORE', href: 'https://login.procore.com/' },
    buildingconnected: { label: 'BUILDINGCONNECTED', href: 'https://app.buildingconnected.com/' }
  };
  const CODES = { CLIENT: 'client', ARCHITECT: 'architect', TRADE: 'trade', 'TRADE PARTNERS': 'trade' };

  /* ---------- Routes: #role (overview) and #role/N (step N, 1-based) ---------- */

  const HOME = { role: null, step: -1 };
  function parse(hash) {
    let raw = String(hash || '').replace(/^#/, '');
    try { raw = decodeURIComponent(raw); } catch (e) {}
    raw = raw.trim().toLowerCase();
    if (!raw) return { ...HOME };
    const [role, step, ...rest] = raw.split('/');
    const p = Object.prototype.hasOwnProperty.call(PATHWAYS, role) ? PATHWAYS[role] : null;
    if (!p) return { ...HOME, invalid: true };
    if (rest.length) return { role, step: -1, invalid: true };
    if (step === undefined || step === '' || step === '0') return { role, step: -1 }; // '#role/0' is the earlier overview form
    const n = /^\d{1,2}$/.test(step) ? Number(step) : NaN;
    if (!(n >= 1 && n <= p.steps.length)) return { role, step: -1, invalid: true };
    return { role, step: n - 1 };
  }
  const hashOf = (v) => (v.role ? '#' + v.role + (v.step >= 0 ? '/' + (v.step + 1) : '') : '');
  const urlOf = (v) => location.pathname + location.search + hashOf(v);
  function parentOf(v) {
    if (v.step > 0) return { role: v.role, step: v.step - 1 };
    if (v.step === 0) return { role: v.role, step: -1 };
    return { ...HOME };
  }

  /* ---------- History: one entry per Access state; CLOSE leaves to wherever the visitor came from ---------- */

  let view = { ...HOME };
  let depth = 0;
  function initState() {
    const s = history.state;
    if (s && s.access) { depth = s.depth || 0; return s; }
    let fromSite = false;
    try {
      const r = document.referrer ? new URL(document.referrer) : null;
      fromSite = !!r && r.origin === location.origin && !/\/client-access(\.html)?$/.test(r.pathname);
    } catch (e) {}
    const st = { access: 1, depth: 0, fromSite, prev: null };
    history.replaceState(st, '', location.href);
    return st;
  }
  let entry = initState();

  function go(next) {
    if (hashOf(next) === hashOf(view)) return render(next, { focus: true });
    depth += 1;
    history.pushState({ access: 1, depth, fromSite: entry.fromSite, prev: hashOf(view) }, '', urlOf(next));
    render(next, { focus: true });
  }
  function back() {
    const target = parentOf(view);
    const s = history.state || {};
    if (depth > 0 && s.prev === hashOf(target)) history.back(); // retrace instead of stacking a new entry
    else go(target);
  }
  function close(e) {
    if (e) e.preventDefault();
    if (entry.fromSite && history.length > depth + 1) history.go(-(depth + 1));
    else location.assign('/');
  }

  window.addEventListener('popstate', (e) => {
    const s = e.state;
    if (s && s.access) depth = s.depth || 0;
    else { // a hash typed into the address bar creates an entry without state
      depth += 1;
      history.replaceState({ access: 1, depth, fromSite: entry.fromSite, prev: hashOf(view) }, '', location.href);
    }
    route({ focus: true });
  });

  function route(opts) {
    const v = parse(location.hash);
    if (v.invalid || location.hash !== hashOf(v)) history.replaceState(history.state, '', urlOf(v));
    render(v, { ...opts, invalid: v.invalid });
  }

  /* ---------- Rendering ---------- */

  function choice(attr, number, name, desc) {
    return `<li><button type="button" class="choice" ${attr}><span class="number">${number}</span><span><span class="name">${esc(name)}</span><span class="desc">${esc(desc)}</span></span><span aria-hidden="true">↗</span></button></li>`;
  }
  function stepBody(p, s) {
    const rows = [];
    if (s.platform) {
      const pl = PLATFORMS[s.platform];
      rows.push(`<li class="step"><span class="number" aria-hidden="true">↗</span><div><strong>OPEN THE PLATFORM</strong><small><a href="${pl.href}" target="_blank" rel="noopener noreferrer">${pl.label} ↗<span class="sr-only"> (opens in a new tab)</span></a><br>YOUR FREEMAN INVITATION IS REQUIRED.</small></div></li>`);
    }
    rows.push(`<li class="step"><span class="number" aria-hidden="true">—</span><div><strong>FREEMAN WALKTHROUGH</strong><small>A short, project-approved instructional video will be placed here after recording and review.</small></div></li>`);
    return `<ul class="steps">${rows.join('')}</ul>`;
  }

  function render(v, opts) {
    const o = opts || {};
    const prevFocus = document.activeElement;
    view = { role: v.role, step: v.step };
    const p = v.role ? PATHWAYS[v.role] : null;
    const s = p && v.step >= 0 ? p.steps[v.step] : null;
    document.body.dataset.view = s ? 'step' : p ? 'overview' : 'home';

    $('back').classList.toggle('hidden', !p);
    $('next').classList.toggle('hidden', !p || v.step >= p.steps.length - 1);
    $('next').textContent = s ? 'NEXT STEP ↗' : 'BEGIN ↗';
    $('next').setAttribute('aria-label', p && v.step < p.steps.length - 1 ? `Next: ${p.steps[v.step + 1].title.toLowerCase()}` : 'Next step');
    $('back').setAttribute('aria-label', !p ? 'Back' : s ? (v.step > 0 ? `Back: ${p.steps[v.step - 1].title.toLowerCase()}` : `Back to ${p.name.toLowerCase()} overview`) : 'Back to all relationships');

    if (!p) {
      $('kicker').textContent = 'FREEMAN / ACCESS';
      $('heading').textContent = 'Welcome.';
      $('intro').textContent = 'One place to begin working together.';
      $('section').textContent = 'YOUR RELATIONSHIP';
      $('body').innerHTML = `<ol class="list">${Object.entries(PATHWAYS).map(([id, pw], i) => choice(`data-role="${id}"`, pad(i + 1), pw.name, pw.summary)).join('') + choice('data-team="true"', '04', 'TEAM ACCESS', 'Freeman OS / Mission Control.')}</ol>`;
      $('note').textContent = 'SELECT A RELATIONSHIP OR ENTER A STUDY CODE.';
    } else if (!s) {
      $('kicker').textContent = p.name + ' / ONBOARDING';
      $('heading').textContent = p.name;
      $('intro').textContent = p.summary;
      $('section').textContent = `${COUNT[p.steps.length]} STEPS`;
      $('body').innerHTML = `<ol class="list">${p.steps.map((st, i) => choice(`data-step="${i}"`, pad(i + 1), st.title, st.text)).join('')}</ol>`;
      $('note').textContent = 'DEMONSTRATION ONLY / NO ACCESS GRANTED, NO MEETING BOOKED, NO DOCUMENTS SUBMITTED.';
    } else {
      $('kicker').textContent = p.name + ' / ONBOARDING';
      $('heading').textContent = s.title;
      $('intro').textContent = s.text;
      $('section').textContent = `STEP ${pad(v.step + 1)} / ${pad(p.steps.length)}`;
      $('body').innerHTML = stepBody(p, s);
      $('note').textContent = 'DEMONSTRATION ONLY / NO ACCESS GRANTED, NO MEETING BOOKED, NO DOCUMENTS SUBMITTED.';
    }
    $('body').scrollTop = 0;
    if (o.invalid) $('note').textContent = 'THAT ADDRESS IS NO LONGER AVAILABLE.';
    if (o.invalid && p) $('note').textContent = 'THAT ADDRESS IS NO LONGER AVAILABLE. SHOWING THE ' + p.name + ' OVERVIEW.';

    if (o.focus) {
      // Keep focus on BACK / NEXT when they remain; otherwise move it to the new heading.
      const keep = (prevFocus === $('back') || prevFocus === $('next')) && !prevFocus.classList.contains('hidden');
      if (!keep) $('heading').focus({ preventScroll: true });
      $('announce').textContent = [p ? p.name : 'Access', s ? `step ${v.step + 1} of ${p.steps.length}, ${s.title}` : p ? 'overview' : 'choose a relationship'].join(', ');
    }
  }

  /* ---------- Controls ---------- */

  $('body').addEventListener('click', (e) => {
    const r = e.target.closest('[data-role]');
    const st = e.target.closest('[data-step]');
    if (e.target.closest('[data-team]')) { location.assign('/team-os?entry=1'); return; }
    if (r) go({ role: r.dataset.role, step: -1 });
    else if (st) go({ role: view.role, step: Number(st.dataset.step) });
  });
  $('back').addEventListener('click', back);
  $('next').addEventListener('click', () => {
    const p = PATHWAYS[view.role];
    if (p && view.step < p.steps.length - 1) go({ role: view.role, step: view.step + 1 });
  });
  $('close').addEventListener('click', close);
  document.addEventListener('keydown', (e) => {
    if (e.key !== 'Escape' || e.defaultPrevented || /^(INPUT|TEXTAREA)$/.test(e.target.tagName)) return;
    if (view.role) { e.preventDefault(); back(); }
  });

  route({ focus: false });
})();
</script></body></html>

<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#f4f4f0"><title>Access — Freeman GC</title><link rel="icon" href="favicon.svg">
<style>
:root{--paper:#f4f4f0;--ink:#30312f;--muted:#858882;--rule:#cfd1cb;--orange:#f05a28}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--paper);color:var(--ink)}body{font:12px/1.6 Monaco,"SFMono-Regular",Consolas,monospace;-webkit-font-smoothing:antialiased}button,a{font:inherit;color:inherit;cursor:pointer}button{background:none;border:0;text-align:left;padding:0}a{text-decoration:none}button:hover,a:hover{color:var(--orange)}button:focus-visible,a:focus-visible{outline:1px solid var(--orange);outline-offset:4px}.frame{height:100dvh;padding:32px 40px;display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:20px}.top,.footer{display:flex;justify-content:space-between;align-items:center;gap:20px}.top{font-size:11px}.muted,.footer,.eyebrow{color:var(--muted)}.footer{border-top:1px solid var(--rule);padding-top:15px;font-size:10px}.stage{display:grid;grid-template-columns:1.1fr 1fr;gap:clamp(45px,8vw,150px);align-items:center;min-height:0}.left,.right{min-width:0}.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.01em}.left h1{font-size:clamp(44px,5.8vw,90px);font-weight:400;letter-spacing:-.065em;line-height:1.1;margin:28px 0 30px;max-width:700px}.left p{font-size:15px;line-height:1.8;max-width:510px}.right{max-width:570px}.right .eyebrow{margin-bottom:30px}.choices{display:grid}.choice{width:100%;display:grid;grid-template-columns:42px 1fr 16px;gap:9px;align-items:center;border-top:1px solid var(--rule);padding:16px 0}.choice:last-child{border-bottom:1px solid var(--rule)}.choice .number{color:var(--orange);font-size:11px}.choice .name{font-size:clamp(15px,1.45vw,20px)}.choice .desc{font-size:11px;color:var(--muted);display:block;margin-top:3px}.steps{width:100%}.step{display:grid;grid-template-columns:38px 1fr;gap:12px;padding:12px 0;border-top:1px solid var(--rule)}.step:last-child{border-bottom:1px solid var(--rule)}.number{color:var(--orange)}.step strong{font-weight:400;font-size:14px}.step small{display:block;color:var(--muted);font-size:11px;line-height:1.7;margin-top:6px}.step a{text-decoration:underline;text-underline-offset:4px}.actions{display:flex;justify-content:space-between;gap:16px;margin-top:26px;font-size:11px}.actions button:last-child{color:var(--orange)}.note{margin-top:24px;font-size:10px;color:var(--muted);line-height:1.7;max-width:55ch}.hidden{display:none}.close{white-space:nowrap}body[data-view=detail] .left h1{font-size:clamp(40px,5vw,75px)}@media(max-width:760px){.frame{padding:20px 20px 18px;gap:12px}.stage{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr);gap:12px;align-items:start}.left{border-bottom:1px solid var(--rule);padding-bottom:12px}.left h1{font-size:clamp(38px,11vw,55px);margin:10px 0}.left p{font-size:11px;line-height:1.55;margin:0}.right{min-height:0;overflow:auto;max-width:none}.right .eyebrow{margin:0 0 12px}.choice{padding:11px 0}.choice .name{font-size:14px}.choice .desc{font-size:10px}.step{padding:8px 0}.step strong{font-size:12px}.step small{font-size:10px;margin-top:2px}.actions{margin-top:14px}.note{font-size:9px;margin-top:12px}.footer{font-size:8px;padding-top:9px}body[data-view=detail] .left h1{font-size:clamp(34px,10vw,50px)}}
.code-form{margin-top:18px;border-top:1px solid var(--rule);padding-top:15px}.code-form label{font-size:10px;color:var(--muted)}.code-line{margin-top:5px;border-bottom:1px solid var(--rule);display:flex;align-items:center}.code-line:focus-within{border-bottom-color:var(--orange)}.code-line input{min-width:0;flex:1;border:0;background:transparent;padding:9px 0;outline:none;font:14px Monaco,Consolas,monospace;color:var(--ink)}.code-line button{padding:7px;font-size:18px}#code-status{display:block;color:var(--orange);font-size:10px;min-height:12px}.choice .desc{max-width:39ch}.note{font-size:9px}.left h1{letter-spacing:-.075em}@media(max-width:760px){.code-form{margin-top:10px;padding-top:8px}.code-line input{font-size:12px;padding:6px 0}}</style></head><body><main class="frame"><header class="top"><span>FREEMAN GC</span><span class="muted">ACCESS / <a class="close" href="index.html">× CLOSE</a></span></header><section class="stage"><div class="left"><div class="eyebrow" id="kicker">FREEMAN / ACCESS</div><h1 id="heading">Welcome.</h1><p id="intro">One place to begin working together.</p></div><div class="right"><div class="eyebrow" id="section">YOUR RELATIONSHIP</div><div id="body" aria-live="polite"></div><div class="actions"><button id="back" class="hidden">← BACK</button><button id="next" class="hidden">CONTINUE ↗</button></div><form id="code-form" class="code-form"><label for="code-entry">HAVE AN ACCESS CODE?</label><div class="code-line"><input id="code-entry" type="text" autocomplete="off" spellcheck="false" placeholder="Enter code" maxlength="64"><button type="submit" aria-label="Submit code">↗</button></div><span id="code-status" role="status"></span></form><div class="note" id="note">SELECT A RELATIONSHIP OR ENTER A STUDY CODE.</div></div></section><footer class="footer"><span>BUILT FOR GENERATIONS</span><span>FREEMAN GENERAL CONTRACTING / PRIVATE</span></footer></main>
<script>
(()=>{'use strict';const $=id=>document.getElementById(id);
const pathways={
client:{name:'CLIENT',steps:[
['01','PROJECT INTRODUCTION','Your Freeman contacts, proposal and project information.'],
['02','PROCORE','Accept your invitation and learn where to find project information, RFIs, submittals and items requiring your review.'],
['03','WORKING WITH FREEMAN','Communication, decisions and what to expect during construction.'],
['04','KICKOFF','Coordinate the first project meeting with your Freeman team.']]},
architect:{name:'ARCHITECT',steps:[
['01','INTRODUCTIONS','Your Freeman contacts and the project team.'],
['02','PROCORE','How to access the project, locate project information, review RFIs and respond to submittals.'],
['03','PROJECT COORDINATION','Project procedures, communication and the first coordination meeting.']]},
trade:{name:'TRADE PARTNERS',steps:[
['01','PREQUALIFICATION','Complete requested company information and qualification documents.'],
['02','BUILDINGCONNECTED','Access invitations and required preconstruction information.'],
['03','PROCORE','Accept your invitation, review project information and locate relevant documents.'],
['04','BILLING & PAYMENT','Understand billing procedures, required documentation and payment terms confirmed by Freeman.'],
['05','PRECONSTRUCTION','Confirm scope, site requirements and mobilization with your Freeman contact.']]}};
let role=null,step=-1;const esc=t=>String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function show(){const r=pathways[role];$('code-form').classList.toggle('hidden',!!r);document.body.dataset.view=r?'detail':'home';$('back').classList.toggle('hidden',!r);$('next').classList.toggle('hidden',!r||step>=r.steps.length-1);if(!r){$('kicker').textContent='FREEMAN / ACCESS';$('heading').innerHTML='Welcome.';$('intro').textContent='One place to begin working together.';$('section').textContent='YOUR RELATIONSHIP';$('body').innerHTML=Object.entries(pathways).map(([id,p],i)=>'<button class="choice" data-role="'+id+'"><span class="number">0'+(i+1)+'</span><span><span class="name">'+p.name+'</span><span class="desc">'+esc(p.intro)+'</span></span><span>↗</span></button>').join('');$('note').innerHTML='SELECT A RELATIONSHIP OR ENTER A STUDY CODE.';history.replaceState(null,'',location.pathname);return}
$('kicker').textContent=r.name+' / ONBOARDING';$('heading').textContent=step<0?r.name:r.steps[step][1];const summaries={client:'Project information, Procore, and kickoff.',architect:'Procore, project information, and coordination.',trade:'Prequalification, billing, and mobilization.'};$('intro').textContent=summaries[role];$('intro').hidden=false;$('section').textContent=step<0?'THE FIRST FIVE STEPS':('STEP '+String(step+1).padStart(2,'0')+' / '+String(r.steps.length).padStart(2,'0'));$('body').innerHTML=step<0?r.steps.map((s,i)=>'<button class="choice" data-step="'+i+'"><span class="number">'+s[0]+'</span><span><span class="name">'+esc(s[1])+'</span><span class="desc">'+esc(s[2])+'</span></span><span>↗</span></button>').join(''):'<div class="steps">'+(r.steps[step][1]==='PROCORE'||r.steps[step][1]==='BUILDINGCONNECTED'?'<div class="step"><span class="number">↗</span><div><strong>OPEN THE PLATFORM</strong><small>'+(r.steps[step][1]==='BUILDINGCONNECTED'?'<a href="https://app.buildingconnected.com/" target="_blank" rel="noopener noreferrer">BUILDINGCONNECTED ↗</a>':'<a href="https://login.procore.com/" target="_blank" rel="noopener noreferrer">PROCORE ↗</a>')+'<br>YOUR FREEMAN INVITATION IS REQUIRED.</small></div></div>':'')+'<div class="step"><span class="number">→</span><div><strong>WHAT TO EXPECT</strong><small>'+esc(r.steps[step][2])+'</small></div></div><div class="step"><span class="number">—</span><div><strong>FREEMAN WALKTHROUGH</strong><small>A short, project-approved instructional video will be placed here after recording and review.</small></div></div></div>';$('next').textContent='NEXT STEP ↗';$('note').textContent='DEMONSTRATION ONLY / NO ACCESS GRANTED, NO MEETING BOOKED, NO DOCUMENTS SUBMITTED.';history.replaceState(null,'',location.pathname+'#'+role+'/'+(step+1))}
$('body').addEventListener('click',e=>{const a=e.target.closest('[data-role]'),b=e.target.closest('[data-step]');if(a){role=a.dataset.role;step=-1;show()}else if(b){step=Number(b.dataset.step);show()}});$('back').onclick=()=>{if(step>=0)step=-1;else role=null;show()};$('next').onclick=()=>{if(role&&step<pathways[role].steps.length-1){step++;show()}};$('code-form').addEventListener('submit',e=>{e.preventDefault();const c=$('code-entry').value.trim().toUpperCase();if(c==='ALDER'){location.href='proposal-alder.html';return}const map={CLIENT:'client',ARCHITECT:'architect',TRADE:'trade'};if(map[c]){role=map[c];step=-1;$('code-status').textContent='';show()}else{$('code-status').textContent='Code not recognized in this study.'}});const m=location.hash.match(/^#(client|architect|trade)\/([0-5])$/);if(m){role=m[1];step=Number(m[2])-1}show()})();
</script></body></html>

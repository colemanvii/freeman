<head>

<meta name="description" content="The Built Record. Case studies of places built by Freeman General Contracting.">
<link rel="icon" href="../favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link rel="stylesheet" href="built.css">

<script defer src="index.js"></script>
</head>
<body>
<header class="fo-top">
  <nav class="fo-nav" aria-label="Sections"><a href="../company.html">Company</a><span aria-hidden="true">/</span><a href="../map.html" aria-current="true">Projects</a><span aria-hidden="true">/</span><a href="../photographs.html">Photographs</a><span aria-hidden="true">/</span><a href="../contact.html">Contact</a></nav>
  <p class="fo-flag">The Built Record · Preview · Not published</p>
  <a class="fo-x" href="../map.html">× Close</a>
</header>
<main class="bi">
  <div class="bi-head"><h1>The Built Record</h1><p>Places Freeman General Contracting has helped bring into existence, set down one at a time.</p></div>
  <ol class="bi-list" id="bi-list"></ol>
  <p class="bi-foot fo-micro"><span>Three studies</span><span>Freeman General Contracting</span></p>
</main>
<script>
addEventListener("DOMContentLoaded", () => {
  const P = window.RECORD_PHOTOS || {}, esc = (v) => String(v).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  document.getElementById("bi-list").innerHTML = (window.BUILT_INDEX || []).map((s) => {
    const ph = P[s.plate], set = ph ? ph.set.map(([w, u]) => `..${u} ${w}w`).join(", ") : "";
    return `<li><a href="${s.slug}.html"><span class="bi-no fo-micro"><b>No. ${esc(s.no)}</b></span><span class="bi-name">${esc(s.name)}</span><span class="bi-what"><span class="fo-micro">${esc(s.place)}</span>${esc(s.line)}</span><span class="bi-pic">${ph ? `<img src="..${ph.set[0][1]}" srcset="${set}" sizes="(max-width:760px) 30vw, 16vw" width="${ph.w}" height="${ph.h}" alt="${esc(s.alt)}">` : ""}</span></a></li>`;
  }).join("");
});
</script>
</body>
</html>

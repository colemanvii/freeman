<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BFG — Private Study</title><style>
:root{--bg:#f4f4f1;--ink:#555750;--rule:#cccec8;--orange:#e75a28}*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--ink)}body{font:15px Monaco,"Courier New",monospace}.frame{height:100dvh;min-height:460px;padding:clamp(20px,3vw,40px);display:grid;grid-template-rows:auto 1fr auto;gap:24px}header,footer{display:flex;justify-content:space-between;gap:12px;font-size:10px;letter-spacing:.07em}header{border-bottom:1px solid var(--rule);padding-bottom:16px}footer{border-top:1px solid var(--rule);padding-top:16px;color:#94978e}main{align-self:center;justify-self:center;width:min(100%,850px)}.tag{color:var(--orange);font-size:11px;margin-bottom:27px}h1{font-size:clamp(40px,7vw,88px);line-height:1.02;letter-spacing:-.07em;font-weight:400;color:#353733;margin:0 0 27px}p{font-size:clamp(15px,1.7vw,22px);line-height:1.55;letter-spacing:-.03em;max-width:780px;margin:0}.note{font-size:12px;line-height:1.7;color:#999b94;margin-top:26px}.entry,.controls{display:flex;gap:20px;align-items:center;margin-top:34px}input{border:0;border-bottom:1px solid var(--rule);border-radius:0;background:none;padding:12px 0;min-width:0;width:260px;max-width:60vw;outline:0;color:var(--ink);font:inherit}button{border:0;background:none;color:var(--ink);font:inherit;font-size:12px;cursor:pointer;padding:10px 0}button:hover{color:var(--orange)}.counter{color:#999b94;font-size:11px}.cursor{display:inline-block;background:var(--orange);width:.53ch;height:.9em;animation:blink 1s steps(1) infinite}@keyframes blink{50%{opacity:0}}[hidden]{display:none!important}@media(max-width:560px){header,footer{font-size:8px}h1{font-size:clamp(38px,11vw,64px)}.frame{gap:12px}}@media(prefers-reduced-motion:reduce){.cursor{animation:none}}</style></head><body><div class="frame"><header><span>FREEMAN GENERAL CONTRACTING</span><span>PRIVATE CONCEPT STUDY / 2026</span></header><main><section id="gate"><div class="tag">TRANSMISSION / ACCESS</div><h1>Built for<br>Generations<span class="cursor"></span></h1><p>A proposal for Gabe Freeman.</p><form id="form" class="entry"><input id="password" type="password" placeholder="ACCESS CODE" aria-label="Access code" autocomplete="off" required><button type="submit">ENTER →</button></form><div id="error" class="note" aria-live="polite"></div></section><section id="study" hidden><div class="tag" id="section"></div><h1 id="title"></h1><p id="copy"></p><div class="note" id="note"></div><div class="controls"><button type="button" id="back">← PREV</button><span class="counter" id="count"></span><button type="button" id="next">NEXT →</button></div></section></main><footer><span>BUILT FOR GENERATIONS™</span><span>SUCCESS / RESILIENCE / MEMORY</span></footer></div><script>
const pages=[
["01 / QUESTION","How do you define success?","What makes a life successful? And what does it take to build something that lasts?","An investigation, not a conclusion."],
["02 / ORIGIN","Resilience.","Gabe and Cole connected, in part, over Eric Greitens’s Resilience. Different professional backgrounds. Shared questions about ambition, responsibility, and the meaning of good work.","The questions matter to us before they become content."],
["03 / INITIATIVE","Built for Generations.","An ongoing editorial project exploring success, resilience, craft, character, family, and legacy through actual lives and honest conversations.","Construction is our vantage point, not our limit."],
["04 / FORMAT","Just conversation.","Two good microphones. A quiet room. Thoughtful questions. No cameras required. Record, transcribe, preserve. Publish only what earns attention.","Audio first. Video later, maybe."],
["05 / MEMORY","What is worth remembering?","Art can preserve what time erases. The voices, decisions, mistakes, and convictions of people we love and learn from deserve more than a passing moment.","A growing archive of stories and hard-earned knowledge."],
["06 / HAVEN","A living memory capsule.","Imagine returning six months later and being able to recall what was said, decided, built, questioned, and learned—in context. Haven could become a dependable memory layer for families and organizations.","Searchable sources, transcripts, permissions, and human oversight—not just an AI chat history."],
["07 / INFLUENCES","The idea, distilled.","Tetragrammaton’s curiosity. Jocko’s discipline. David Senra’s preparation. Dry Creek Wrangler School’s plainspoken insight. TBPN’s chemistry. Jack Butcher and Visualize Value’s clarity.","Learn from the principles. Don’t mimic the shows."],
["08 / PEOPLE","The stories are everywhere.","Builders, craftspeople, architects, artists, musicians, entrepreneurs, parents, mentors. Start with people we know. Let the relationships and conversations lead.","A Dream 100 can remain a horizon, not a promise."],
["09 / PILOT","One conversation.","Gabe and Cole. One 45–60 minute recording. Begin with: How do you define success? Create a transcript, a written dispatch, and one restrained animated audio excerpt.","Review the result together before committing to a series."],
["10 / PROPOSAL","Make something worth keeping.","The result proves taste. The evidence proves capability. The stories reveal character.","Build the archive before the audience. — Cole"]
];let i=0;function render(){const p=pages[i];document.getElementById("section").textContent=p[0];document.getElementById("title").textContent=p[1];document.getElementById("copy").textContent=p[2];document.getElementById("note").textContent=p[3];document.getElementById("count").textContent=String(i+1).padStart(2,"0")+" / "+pages.length;document.getElementById("back").disabled=i===0;document.getElementById("next").textContent=i===pages.length-1?"RESTART ↻":"NEXT →"}
document.getElementById("form").addEventListener("submit",e=>{e.preventDefault();if(document.getElementById("password").value.trim().toLowerCase()!=="gabe"){document.getElementById("error").textContent="ACCESS DENIED";return}document.getElementById("gate").hidden=true;document.getElementById("study").hidden=false;render()});document.getElementById("next").onclick=()=>{i=(i+1)%pages.length;render()};document.getElementById("back").onclick=()=>{if(i>0)i--;render()};document.addEventListener("keydown",e=>{if(document.getElementById("study").hidden)return;if(e.key==="ArrowRight")document.getElementById("next").click();if(e.key==="ArrowLeft")document.getElementById("back").click()});
</script></body></html>

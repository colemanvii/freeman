<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#fff9f1"><title>The Record — Freeman</title>
<script src="/palette.js"></script>
<link rel="icon" href="/favicon.svg">
<link rel="stylesheet" href="record.css?v=001">
</head><body data-mode="map">
<div class="border" aria-hidden="true"><div class="ref ref-top" id="ref-top"></div><div class="ref ref-left" id="ref-left"></div></div>
<div class="app">
 <header class="bar">
  <a class="brand" href="/">FREEMAN <b>/</b> THE RECORD</a>
  <span class="crumb" id="crumb"></span>
  <form class="find" id="find" role="search" autocomplete="off">
   <label class="sr-only" for="q">Find a project or place</label>
   <input id="q" type="search" placeholder="Find a project or place" aria-controls="found" aria-expanded="false" aria-autocomplete="list">
   <ol class="found" id="found" role="listbox" aria-label="Matches" hidden></ol>
  </form>
  <a class="close" href="/etcetera">× CLOSE</a>
 </header>

 <main class="field" id="field">
  <div class="map" id="map" tabindex="0" aria-label="Map of Freeman projects. Drag or use arrow keys to move, plus and minus to zoom." role="application">
   <svg id="svg" aria-hidden="true"><g id="world"></g></svg>
   <div class="marks" id="marks"></div>
   <div class="lede" id="lede">
    <p class="kicker">THE RECORD / NORTH GEORGIA</p>
    <h1>Places we’ve<br>helped build.</h1>
   </div>
   <div class="instruments" aria-hidden="false">
    <div class="north" aria-hidden="true"><svg viewBox="0 0 20 34"><path d="M10 2v30M10 2l-5 12h10z" /></svg><span>N</span></div>
    <div class="scale" id="scale" aria-hidden="true"><i></i><span></span></div>
    <span class="coord" id="coord" aria-hidden="true"></span>
    <div class="zoom"><button type="button" id="zin" aria-label="Zoom in">+</button><button type="button" id="zout" aria-label="Zoom out">−</button><button type="button" id="zfit" aria-label="Show all places">ALL</button></div>
   </div>
  </div>
  <div class="rule" id="rule"></div>
 </main>

 <aside class="tblock" id="tblock" aria-label="Register"></aside>
 <section class="record" id="record" hidden aria-labelledby="rec-name" tabindex="-1"></section>
</div>
<p id="announce" class="sr-only" aria-live="polite" aria-atomic="true"></p>
<script src="/records.js"></script>
<script src="/eagle/eagle-motion.js"></script>
<script src="geo.js?v=001"></script>
<script src="sites.js?v=001"></script>
<script src="record.js?v=001"></script>
</body></html>

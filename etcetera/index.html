<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f8f6f0">
<title>ETCETERA — Freeman GC</title>
<style>
:root{--paper:#f8f6f0;--ink:#272722;--red:#ec4434;--muted:#a19d94}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;height:100dvh;overflow:hidden;background:var(--paper);color:var(--ink)}
body{font-family:Monaco,'Courier New',monospace;-webkit-font-smoothing:antialiased}
main{height:100%;height:100dvh;min-height:0;position:relative;padding:28px 34px;overflow:hidden}
header{display:flex;justify-content:space-between;align-items:center;gap:20px;font-size:11px;letter-spacing:.01em;line-height:1.4}
nav{display:flex;align-items:center;gap:13px}.sep{color:var(--muted)}.active{color:var(--red)}
a{color:inherit;text-decoration:none}a:hover,a:focus-visible{color:var(--red)}a:focus-visible{outline:1px solid var(--red);outline-offset:5px}
footer{position:absolute;bottom:22px;left:34px;right:34px;display:flex;justify-content:space-between;font-size:8px;letter-spacing:.06em;color:var(--muted)}
@media(max-width:700px){main{padding:18px 18px}header{font-size:10px}footer{left:18px;right:18px;bottom:16px}}
</style>
</head>
<body>
<main>
<header><nav aria-label="Location"><a href="/">FREEMAN GC</a><span class="sep">/</span><span class="active" aria-current="page">ETCETERA</span></nav><a href="/" aria-label="Close Etcetera and return to Freeman">× CLOSE</a></header>
<footer><span>BUILT FOR GENERATIONS™</span><span>FREEMAN GENERAL CONTRACTING</span></footer>
